                    {

                    cardBg: "#FFFFFF", cardBorder: "#E5E7EB", textMuted: "#6B7280", btnBg: "#FFFFFF", btnBorder: "#D1D5DB"     
                },
                darkColors: {
                    bgColor: "#121212", textColor: "#F3F4F6", accentColor: "#10B981", accentHover: "#059669",

                },

            },

            ui: { loadingText: "Cargando aplicación...", backText: "Menú" },

            mainContent: {
                aiChat: {
                    title: "Tu Asistente Personal",
                    subtitle: "Dile a nuestra IA qué se te antoja, tu presupuesto o con quién estás, y encontrará el mejor lugar en nuestro Portal Comercial.",
                    placeholder: "Ej: Busco una pizzería para ir con niños hoy...",
                    statsText: "Solo Negocios Verificados",
                    btnText: "Explorar el Portal de manera manual."
                },
                promos: [
                    { name: "eBPartners MX", desc: "Estrategias de marketing basadas en datos.", url: "#", hexColor: "#059669", logo: "logo_publimapa.png" },
                    { name: "TechStore Plus", desc: "Descuentos en accesorios.", url: "#", hexColor: "#2563eb", logo: "logo_publimapa.png" }
                ],
                marketplace: [
                    { name: "Artículos del Hogar", desc: "Todo para tu casa.", url: "#", hexColor: "#ea580c", logo: "logo_publimapa.png" },
                    { name: "Ropa Deportiva", desc: "Equípate para entrenar.", url: "#", hexColor: "#16a34a", logo: "logo_publimapa.png" }
                ],
                alianzas: [
                    { name: "Banamex Pymes", desc: "Créditos preferenciales.", url: "#", hexColor: "#0369a1", logo: "logo_publimapa.png" },
                    { name: "Cámara de Comercio", desc: "Afiliación y beneficios.", url: "#", hexColor: "#be123c", logo: "logo_publimapa.png" }
                ]
            },

            menuGroups: [
                {
                    id: "directorio", title: "Portal Comercial", icon: "bookmark-check", isOpen: true,
                    items: [
                        { id: "automotriz", label: "Automotriz", icon: "car", url: "automotriz.html" },
                        { id: "belleza", label: "Belleza y Bienestar", icon: "sparkles", url: "belleza.html" },
                        { id: "construccion", label: "Bienes Raices y Construcción", icon: "hard-hat", url: "construccion.html" },
                        { id: "cafe", label: "Café y Postres", icon: "coffee", url: "cafe.html" },
                        { id: "casa", label: "Casa y Decoración", icon: "sofa", url: "casa.html" },
                        { id: "computacion", label: "Computación y Electrónica", icon: "pc-case", url: "computacion.html" },
                        { id: "decompras", label: "De Compras y Regalos", icon: "gift", url: "decompras.html" },
                        { id: "deportes", label: "Deportes y Gimnasions", icon: "trophy", url: "deportes.html" },
                        { id: "educacion", label: "Educación y Aprendizaje", icon: "graduation-cap", url: "educacion.html" },
                        { id: "hoteles", label: "Hoteles y Hospedajes", icon: "bed", url: "hoteles.html" },
                        { id: "mascotas", label: "Mascotas", icon: "paw-print", url: "mascotas.html" },
                        { id: "medicina", label: "Medicina y Salud", icon: "heart-pulse", url: "medicina.html" },
                        { id: "oficios", label: "Oficios y Mantenimiento", icon: "drill", url: "oficios.html" },
                        { id: "restaurantes", label: "Restaurantes y Comida", icon: "utensils-crossed", url: "restaurantes.html" },
                        { id: "profesionales", label: "Servicios Profesionales", icon: "signature", url: "profesionales.html" },
                        { id: "tecnologia", label: "Tecnología y Comunicación", icon: "tablet-smartphone", url: "tecnologia.html" },
                        { id: "tiempolibre", label: "Tiempo Libre", icon: "popcorn", url: "tiempolibre.html" },
                        { id: "viajes", label: "Viajes y Turismo", icon: "luggage", url: "viajes.html" },
                        { id: "vidanocturan", label: "Vida Nocturna y Bares", icon: "martini", url: "vidanocturna.html" }
                    ]
                },
                {
                    id: "ofertasypromos", title: "Ofertas y Promociones", icon: "tags", isOpen: false,
                    items: [
                        { id: "servicios", label: "Servicios Profesionales", icon: "briefcase", url: "servicios.html" }

                }
            ],
            
            extras: [
                { id: "mediakit", label: "Media Kit", icon: "ad", url: "mediakit/index.html" },
                { id: "registro", label: "Crear Perfil", icon: "user-plus", url: "registro.html" },

        };

        const fontLink = document.createElement('link');
        fontLink.href = COVER_CONFIG.theme.fontUrl;
        fontLink.rel = "stylesheet";
        document.head.appendChild(fontLink);

        const styleVars = document.createElement('style');
        styleVars.innerHTML = `
            :root {
                --c-bg: ${COVER_CONFIG.theme.colors.bgColor}; --c-text: ${COVER_CONFIG.theme.colors.textColor};
                --c-accent: ${COVER_CONFIG.theme.colors.accentColor}; --c-accent-hover: ${COVER_CONFIG.theme.colors.accentHover};
                --c-card-bg: ${COVER_CONFIG.theme.colors.cardBg}; --c-card-border: ${COVER_CONFIG.theme.colors.cardBorder};
                --c-text-muted: ${COVER_CONFIG.theme.colors.textMuted}; --c-btn-bg: ${COVER_CONFIG.theme.colors.btnBg}; --c-btn-border: ${COVER_CONFIG.theme.colors.btnBorder};
            }
            html.dark {
                --c-bg: ${COVER_CONFIG.theme.darkColors.bgColor}; --c-text: ${COVER_CONFIG.theme.darkColors.textColor};
                --c-accent: ${COVER_CONFIG.theme.darkColors.accentColor}; --c-accent-hover: ${COVER_CONFIG.theme.darkColors.accentHover};
                --c-card-bg: ${COVER_CONFIG.theme.darkColors.cardBg}; --c-card-border: ${COVER_CONFIG.theme.darkColors.cardBorder};
                --c-text-muted: ${COVER_CONFIG.theme.darkColors.textMuted}; --c-btn-bg: ${COVER_CONFIG.theme.darkColors.btnBg}; --c-btn-border: ${COVER_CONFIG.theme.darkColors.btnBorder};
            }
        `;
        document.head.appendChild(styleVars);

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        appBg: 'var(--c-bg)', appText: 'var(--c-text)', appAccent: 'var(--c-accent)', appAccentHover: 'var(--c-accent-hover)',
                        appCardBg: 'var(--c-card-bg)', appCardBorder: 'var(--c-card-border)', appTextMuted: 'var(--c-text-muted)', appBtnBg: 'var(--c-btn-bg)', appBtnBorder: 'var(--c-btn-border)'
                    },
                    fontFamily: { heading: [COVER_CONFIG.theme.fontHeading, 'serif'], body: [COVER_CONFIG.theme.fontBody, 'sans-serif'] }
                }
            }
        };
    </script>

    <style>
        body { overflow: hidden; margin: 0; padding: 0; background-color: var(--c-bg); color: var(--c-text); }
        #cover-view { transition: transform 0.6s cubic-bezier(0.8, 0, 0.2, 1), opacity 0.5s ease; transform-origin: center left; width: 100vw; height: 100vh; overflow-y: auto; }
        iframe { border: none; width: 100%; height: calc(100vh - 4.5rem); transition: opacity 0.5s ease; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--c-card-border); border-top-color: var(--c-accent); animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        /* Pequeño spinner para el botón de chat */
        .chat-spinner { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #bfdbfe; border-top-color: #2563eb; animation: spin 1s linear infinite; }
        
        .menu-link { transition: all 0.2s ease; }
        .menu-link:hover { background-color: var(--c-btn-bg); color: var(--c-text); transform: translateX(4px); }
        .menu-link:hover .menu-icon { stroke: var(--c-accent); }
        
        /* Markdown Chat Styles */
        .chat-content p { margin-bottom: 0.75rem; }
        .chat-content strong { font-weight: bold; color: #facc15; }
        .chat-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.75rem; }
    </style>
</head>
<body class="antialiased font-body flex flex-col md:flex-row min-h-[100dvh] transition-colors duration-300">

    <nav id="app-nav" class="fixed w-full z-[70] top-0 left-0 h-[4.5rem] px-6 flex justify-between items-center shadow-sm bg-appCardBg/95 backdrop-blur-md border-b border-appCardBorder hidden transition-colors duration-300">
        <div class="flex items-center gap-3">
            <img id="nav-brand-logo" src="" alt="Logo" class="h-8 w-auto object-contain">
            <div class="font-heading font-bold text-xl tracking-tight text-appText uppercase" id="ui-nav-brand">Módulo</div>
        </div>
        <button onclick="closeIframe()" class="text-xs font-bold font-body tracking-wider bg-appAccent text-white px-4 py-2.5 rounded-lg shadow-sm hover:bg-appAccentHover transition-all uppercase flex items-center gap-2">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span id="ui-btn-back">Volver</span>
        </button>
    </nav>

    <div id="cover-view" class="flex flex-col lg:flex-row min-h-[100dvh] w-full bg-appBg relative transition-colors duration-300">
        
        <button onclick="toggleMobileMenu()" class="lg:hidden absolute top-6 left-6 z-30 px-6 py-3.5 bg-appCardBg/95 backdrop-blur-md border border-appCardBorder text-appText rounded-full shadow-lg flex items-center justify-center gap-3 hover:bg-appBg transition-colors">
            <i data-lucide="menu" class="w-5 h-5 text-appAccent"></i>

        <aside id="sidebar-menu" class="fixed inset-y-0 left-0 z-50 w-[85%] max-w-sm lg:relative lg:w-[22rem] lg:translate-x-0 transform -translate-x-full transition-transform duration-300 ease-in-out bg-appCardBg border-r border-appCardBorder flex flex-col h-[100dvh] flex-shrink-0 shadow-2xl lg:shadow-none">
            <button onclick="toggleMobileMenu()" class="lg:hidden absolute top-6 right-6 text-appTextMuted hover:text-appText w-10 h-10 flex items-center justify-center bg-appBg rounded-full border border-appCardBorder transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <div class="p-8 pb-4 border-b border-appCardBorder mt-4 lg:mt-0 flex flex-col items-center text-center">
                <img id="sidebar-brand-logo" src="" alt="Brand Logo" class="w-24 h-auto object-contain mb-3 opacity-85 transition-opacity hover:opacity-100">

            <div class="flex-grow overflow-y-auto hide-scrollbar p-6 pb-2">

                <div class="text-xs font-bold tracking-widest text-appTextMuted uppercase mb-4 px-3 mt-6 border-t border-appCardBorder pt-6">PUBLIMAPA</div>

                    <div class="flex items-center justify-center w-12 h-6 bg-appCardBorder rounded-full relative cursor-pointer border border-appTextMuted/20 transition-colors" onclick="toggleDarkMode()">
                        <div id="themeToggleBall" class="absolute left-1 top-1 bg-appBtnBg w-4 h-4 rounded-full transition-transform duration-200 ease-in-out flex items-center justify-center shadow-sm">
                            <i data-lucide="moon" class="w-3 h-3 text-appTextMuted" id="themeIcon"></i>
                        </div>
                    </div>
                </div>
                <p class="text-[10px] text-center text-appTextMuted font-body tracking-wider mt-1">
                    &copy; <span id="current-year"></span> <span id="copyright-brand"></span>

        <main class="flex-grow overflow-y-auto relative bg-appBg w-full h-[100dvh]" id="main-content-scroll">
            
            <section id="slider-container" class="relative w-full h-[70vh] min-h-[500px] bg-black overflow-hidden flex-shrink-0"></section>
            <section id="ai-chat-container" class="w-full max-w-7xl mx-auto px-6 py-12 lg:py-16"></section>
            <section id="portal-comercial-container" class="w-full max-w-7xl mx-auto px-6 pb-12 lg:pb-16"></section>
            <section id="promos-container" class="w-full max-w-7xl mx-auto px-6 pb-12 lg:pb-16 hidden"></section>
            <section id="marketplace-container" class="w-full max-w-7xl mx-auto px-6 pb-12 lg:pb-16 hidden"></section>

    <div id="app-shell" class="fixed inset-0 z-[60] pt-[4.5rem] flex flex-col items-center justify-center hidden bg-appBg transition-colors duration-300">
        <div id="loading-state" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-4">
            <div class="spinner"></div>
            <p class="text-xs font-body tracking-widest text-appTextMuted uppercase font-bold animate-pulse" id="ui-loading-text">Cargando...</p>
        </div>
        <iframe id="content-frame" class="opacity-0 bg-transparent w-full h-full"></iframe>
    </div>

    <script>
        document.getElementById('sidebar-brand-logo').src = COVER_CONFIG.global.brandLogoUrl;
        document.getElementById('nav-brand-logo').src = COVER_CONFIG.global.brandLogoUrl;
        document.getElementById('copyright-brand').innerText = COVER_CONFIG.global.brandName;
        document.getElementById('hero-title').innerText = COVER_CONFIG.global.title;
        document.getElementById('ui-btn-back').innerText = COVER_CONFIG.ui.backText;
        document.getElementById('ui-loading-text').innerText = COVER_CONFIG.ui.loadingText;
        document.getElementById('current-year').innerText = new Date().getFullYear();

        let currentSlide = 0;
        let slideInterval;
        const slidesData = COVER_CONFIG.global.slides;

        function initSlider() {
            const container = document.getElementById('slider-container');
            let slidesHTML = ''; let dotsHTML = '';
            
            slidesData.forEach((slide, index) => {
                slidesHTML += `
                <div class="absolute inset-0 transition-opacity duration-1000 ease-in-out z-0 slide-el" id="slide-${index}" style="opacity: ${index === 0 ? '1' : '0'}">
                    <img src="${slide.image}" class="absolute inset-0 w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
                    <div class="absolute inset-0 flex flex-col justify-end p-8 lg:p-16 pb-24 z-10">
                        <h2 class="text-4xl md:text-5xl lg:text-6xl font-heading font-bold text-white mb-4 drop-shadow-lg slide-text" style="opacity: ${index === 0 ? '1' : '0'}; transform: ${index === 0 ? 'translateY(0)' : 'translateY(20px)'}; transition: all 0.8s ease ${index === 0 ? '0.3s' : '0s'}">${slide.title}</h2>
                        <p class="text-lg md:text-xl text-gray-200 font-body mb-8 max-w-2xl slide-text" style="opacity: ${index === 0 ? '1' : '0'}; transform: ${index === 0 ? 'translateY(0)' : 'translateY(20px)'}; transition: all 0.8s ease ${index === 0 ? '0.5s' : '0s'}">${slide.subtitle}</p>
                        <div class="slide-text" style="opacity: ${index === 0 ? '1' : '0'}; transform: ${index === 0 ? 'translateY(0)' : 'translateY(20px)'}; transition: all 0.8s ease ${index === 0 ? '0.7s' : '0s'}">
                            <button onclick="openIframe('${slide.url}', '${slide.label}')" class="bg-appAccent text-white px-6 py-3 lg:px-8 lg:py-4 rounded-xl font-bold font-body uppercase tracking-wider hover:bg-appAccentHover transition-all shadow-lg flex items-center gap-3 w-max group text-sm lg:text-base border border-transparent">
                                ${slide.ctaText} 
                                <i data-lucide="arrow-right" class="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
                dotsHTML += `<button onclick="goToSlide(${index})" class="w-2.5 h-2.5 rounded-full transition-all duration-300 ${index === 0 ? 'bg-appAccent w-8' : 'bg-white/50 hover:bg-white/80'}" id="dot-${index}"></button>`;
            });
            
            container.innerHTML = slidesHTML + `
            <div class="absolute bottom-8 left-0 right-0 flex justify-center gap-2 z-20">${dotsHTML}</div>
            <button onclick="prevSlide()" class="absolute left-4 lg:left-8 top-1/2 -translate-y-1/2 w-10 h-10 lg:w-12 lg:h-12 rounded-full bg-black/20 backdrop-blur-md border border-white/20 text-white flex items-center justify-center hover:bg-black/50 transition z-20"><i data-lucide="chevron-left" class="w-5 h-5 lg:w-6 lg:h-6"></i></button>
            <button onclick="nextSlide()" class="absolute right-4 lg:right-8 top-1/2 -translate-y-1/2 w-10 h-10 lg:w-12 lg:h-12 rounded-full bg-black/20 backdrop-blur-md border border-white/20 text-white flex items-center justify-center hover:bg-black/50 transition z-20"><i data-lucide="chevron-right" class="w-5 h-5 lg:w-6 lg:h-6"></i></button>`;
            
            startAutoSlide();
        }

        function goToSlide(index) {
            if (index < 0) index = slidesData.length - 1;
            if (index >= slidesData.length) index = 0;
            const prevSlideIdx = currentSlide; currentSlide = index;
            
            const prevEl = document.getElementById(`slide-${prevSlideIdx}`);
            if(prevEl) { 
                prevEl.style.opacity = '0'; prevEl.style.zIndex = '0'; 
                prevEl.querySelectorAll('.slide-text').forEach(t => { t.style.opacity = '0'; t.style.transform = 'translateY(20px)'; t.style.transitionDelay = '0s'; }); 
            }
            
            const currEl = document.getElementById(`slide-${currentSlide}`);
            if(currEl) { 
                currEl.style.opacity = '1'; currEl.style.zIndex = '10'; 
                currEl.querySelectorAll('.slide-text').forEach((t, i) => { t.style.transitionDelay = `${0.3 + (i * 0.2)}s`; t.style.opacity = '1'; t.style.transform = 'translateY(0)'; }); 
            }
            
            for (let i = 0; i < slidesData.length; i++) { 
                const dot = document.getElementById(`dot-${i}`); 
                if (dot) dot.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 ${i === currentSlide ? 'bg-appAccent w-8' : 'bg-white/50 hover:bg-white/80'}`; 
            }
            resetAutoSlide();
        }
        function nextSlide() { goToSlide(currentSlide + 1); }
        function prevSlide() { goToSlide(currentSlide - 1); }
        function startAutoSlide() { slideInterval = setInterval(nextSlide, 5000); }
        function resetAutoSlide() { clearInterval(slideInterval); startAutoSlide(); }
        initSlider();

        function createMenuLink(item) {
            return `
                <button onclick="openIframe('${item.url}', '${item.label}')" class="menu-link w-full flex items-center justify-between py-2.5 px-3 rounded-lg text-left text-appTextMuted font-medium font-body group focus:outline-none hover:bg-appBg">
                    <div class="flex items-center gap-3.5">
                        <i data-lucide="${item.icon}" class="w-5 h-5 menu-icon transition-colors"></i>
                        <span class="text-[15px] text-appText">${item.label}</span>
                    </div>
                    <i data-lucide="arrow-right" class="w-4 h-4 text-appAccent opacity-0 group-hover:opacity-100 transition-all -translate-x-2 group-hover:translate-x-0"></i>
                </button>
            `;
        }

        const activeMenuGroups = COVER_CONFIG.menuGroups.filter(group => {
            if (group.id === "ofertasypromos") return COVER_CONFIG.features.showOfertas;
            if (group.id === "marketplace") return COVER_CONFIG.features.showMarketplace;
            if (group.id === "alianzas") return COVER_CONFIG.features.showAlianzas;
            return true;
        });

        const menuAccordionHtml = activeMenuGroups.map((group, index) => {
            const isExpanded = group.isOpen === true;
            return `
                <div class="mb-3 border border-appCardBorder rounded-xl overflow-hidden shadow-sm bg-appCardBg">
                    <button onclick="toggleAccordion(${index})" class="w-full flex items-center justify-between p-3.5 bg-appBg hover:opacity-80 transition-opacity focus:outline-none">
                        <div class="flex items-center gap-3">
                            <i data-lucide="${group.icon}" class="w-5 h-5 text-appAccent"></i>
                            <span class="font-bold text-base text-appText">${group.title}</span>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-appTextMuted transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}" id="icon-acc-${index}"></i>
                    </button>
                    <div id="acc-${index}" class="${isExpanded ? 'flex' : 'hidden'} flex-col gap-0.5 p-2 bg-appCardBg border-t border-appCardBorder">
                        ${group.items.map(item => createMenuLink(item)).join('')}
                    </div>
                </div>
            `;
        }).join('');
        
        document.getElementById('menu-accordion-container').innerHTML = menuAccordionHtml;
        document.getElementById('menu-extras').innerHTML = COVER_CONFIG.extras.map(createMenuLink).join('');

        window.toggleAccordion = function(index) {
            const content = document.getElementById('acc-' + index);
            const icon = document.getElementById('icon-acc-' + index);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden'); content.classList.add('flex');
                icon.classList.add('rotate-180');
            } else {
                content.classList.add('hidden'); content.classList.remove('flex');
                icon.classList.remove('rotate-180');
            }
        };

        // LÓGICA DE CHAT IA
        window.handleChatKeyPress = function(e) {
            if (e.key === 'Enter') sendChatMessage();
        };

        window.sendChatMessage = async function() {
            const input = document.getElementById('ai-chat-input');
            const btn = document.getElementById('ai-chat-btn');
            const results = document.getElementById('ai-chat-results');
            const query = input.value.trim();

            if (!query) return;

            // Bloquear input y mostrar loading
            input.disabled = true;
            btn.innerHTML = '<div class="chat-spinner"></div>';
            
            results.classList.remove('hidden');
            results.innerHTML = `
                <div class="flex items-center justify-center py-8">
                    <div class="spinner border-t-blue-500 w-8 h-8"></div>
                    <span class="ml-3 text-blue-100 font-body animate-pulse">Buscando las mejores opciones para ti...</span>
                </div>
            `;
            lucide.createIcons();

            try {
                // LLAMADA AL ENDPOINT DEL WORKER DE CLOUDFLARE
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userMessage: query })
                });

                if (!response.ok) {
                    throw new Error(`Error del servidor: ${response.status}`);
                }

                const data = await response.json();
                
                // Formatear respuesta (El Worker devuelve un Array JSON de negocios)
                renderChatResults(data, results);

            } catch (error) {
                console.error("Error AI Chat:", error);
                results.innerHTML = `
                    <div class="bg-red-500/20 border border-red-400/50 rounded-xl p-4 flex items-start gap-3">
                        <div class="w-8 h-8 rounded-full bg-red-500/20 flex items-center justify-center shrink-0 mt-1">
                            <i data-lucide="alert-circle" class="w-5 h-5 text-red-400"></i>
                        </div>
                        <div class="text-red-100 font-body text-sm mt-1">
                            Ocurrió un problema de conexión con el asistente. Por favor, intenta de nuevo más tarde.
                        </div>
                    </div>
                `;
            } finally {
                input.disabled = false;
                input.value = ''; // Limpiar el campo
                btn.innerHTML = '<i data-lucide="arrow-up" class="w-5 h-5"></i>';
                lucide.createIcons();
            }
        };

        function renderChatResults(data, container) {
            const businesses = Array.isArray(data) ? data : [data];

            if (!businesses || businesses.length === 0) {
                container.innerHTML = `
                    <div class="bg-yellow-500/20 border border-yellow-400/50 rounded-xl p-4 flex items-start gap-3">
                        <i data-lucide="search-x" class="w-5 h-5 text-yellow-300 shrink-0 mt-1"></i>
                        <div class="text-yellow-100 font-body text-sm mt-1">
                            No encontré negocios que coincidan exactamente con tu búsqueda. Intenta con otros términos.
                        </div>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            let html = '<div class="space-y-4 max-h-[400px] overflow-y-auto hide-scrollbar pr-2">';
            
            businesses.forEach((biz, i) => {
                html += `
                    <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-xl p-5 hover:bg-white/20 transition-colors">
                        <div class="flex items-start justify-between">
                            <div>
                                <h3 class="font-heading font-bold text-lg text-white">${biz.name || biz.profileName || "Negocio " + (i + 1)}</h3>
                                ${biz.category ? `<span class="inline-block bg-blue-500/30 border border-blue-400/50 text-blue-100 text-[10px] uppercase tracking-wider font-bold px-2.5 py-1 rounded-full mt-2">${biz.category}</span>` : ""}
                            </div>
                        </div>
                        ${biz.description ? `<p class="text-blue-100/80 font-body text-sm mt-3 leading-relaxed">${biz.description}</p>` : ""}
                        ${biz.reason ? `<p class="text-xs text-yellow-300 mt-3 italic">✨ ${biz.reason}</p>` : ""}
                        
                        ${(biz.phone || biz.email || biz.website) ? `
                            <div class="mt-4 pt-4 border-t border-white/10 flex flex-wrap gap-3 text-xs">
                                ${biz.phone ? `<span class="text-white flex items-center gap-1.5"><i data-lucide="phone" class="w-3.5 h-3.5 opacity-70"></i> ${biz.phone}</span>` : ""}
                                ${biz.email ? `<span class="text-white flex items-center gap-1.5"><i data-lucide="mail" class="w-3.5 h-3.5 opacity-70"></i> ${biz.email}</span>` : ""}
                                ${biz.website ? `<a href="${biz.website}" target="_blank" class="text-blue-300 hover:text-white flex items-center gap-1.5 transition-colors"><i data-lucide="globe" class="w-3.5 h-3.5"></i> Sitio Web</a>` : ""}
                            </div>
                        ` : ""}
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
            lucide.createIcons();
        }

        function initMainContent() {
            const config = COVER_CONFIG.mainContent;

            // --- B. AI Chat ---
            // Modificado para incluir IDs: ai-chat-input, ai-chat-btn, ai-chat-results
            const aiHtml = `
                <div class="w-full rounded-[2rem] bg-gradient-to-br from-blue-600 to-indigo-700 p-8 lg:p-12 shadow-xl relative overflow-hidden flex flex-col lg:flex-row items-start justify-between gap-8">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
                    <div class="relative z-10 w-full lg:w-[60%]">
                        <div class="inline-flex items-center gap-2 bg-white/20 backdrop-blur-md border border-white/20 rounded-full px-4 py-1.5 mb-6 text-white text-xs font-bold tracking-wider uppercase">
                            <i data-lucide="sparkles" class="w-4 h-4 text-yellow-300"></i> Búsqueda Conversacional IA
                        </div>
                        <h2 class="text-3xl lg:text-4xl font-heading font-bold text-white mb-4">${config.aiChat.title}</h2>
                        <p class="text-blue-100 font-body text-lg mb-8 max-w-xl">${config.aiChat.subtitle}</p>
                        
                        <div class="relative w-full max-w-2xl">
                            <input id="ai-chat-input" onkeypress="handleChatKeyPress(event)" type="text" placeholder="${config.aiChat.placeholder}" class="w-full bg-white/10 border border-white/20 rounded-full py-4 pl-6 pr-16 text-white placeholder-blue-200 focus:outline-none focus:bg-white/20 transition-all font-body shadow-inner">
                            <button id="ai-chat-btn" onclick="sendChatMessage()" class="absolute right-2 top-2 bottom-2 aspect-square bg-white text-blue-600 rounded-full flex items-center justify-center hover:bg-blue-50 transition-colors shadow-md">
                                <i data-lucide="arrow-up" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="relative z-10 w-full lg:w-[35%] flex flex-col items-center lg:items-end gap-4 h-full min-h-[300px]">
                        <!-- Contenedor para mostrar la respuesta de la IA (Ahora a la derecha) -->
                        <div id="ai-chat-results" class="hidden w-full h-full bg-black/20 backdrop-blur-xl border border-white/20 rounded-2xl p-2 transition-all shadow-2xl">
                        </div>
                        
                        <!-- Estado inicial a la derecha (se oculta cuando hay resultados) -->
                        <div id="ai-chat-default-right" class="w-full flex flex-col items-center lg:items-end gap-4">
                            <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-6 text-center w-full">
                                <div class="text-4xl font-bold text-yellow-400 mb-1">IMPULSAMOS</div>
                                <div class="text-sm font-medium text-blue-100">a MiPyMEs y Profesionales</div>
                            </div>
                            <button onclick="document.getElementById('portal-comercial-container').scrollIntoView({behavior: 'smooth'})" class="w-full border border-white/40 hover:bg-white/10 text-white font-bold py-3.5 rounded-xl transition-colors">
                                ${config.aiChat.btnText}
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('ai-chat-container').innerHTML = aiHtml;

            // Modificar la función sendChatMessage para ocultar el estado por defecto
            const originalSendChat = window.sendChatMessage;
            window.sendChatMessage = async function() {
                 document.getElementById('ai-chat-default-right').style.display = 'none';
                 await originalSendChat();
            };

            const categories = COVER_CONFIG.menuGroups.find(g => g.id === "directorio")?.items || [];
            const portalHtml = `
                <div class="flex items-center gap-3 mb-6 px-2">
                    <i data-lucide="bookmark-check" class="w-7 h-7 text-appAccent"></i>
                    <h3 class="text-2xl font-heading font-bold text-appText">Portal Comercial</h3>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 lg:gap-4">
                    ${categories.map(cat => `
                        <button onclick="openIframe('${cat.url}', '${cat.label}')" class="flex items-center bg-appCardBg border border-appCardBorder rounded-full py-4 px-6 shadow-sm hover:shadow-md hover:border-appAccent transition-all group w-full focus:outline-none">
                            <i data-lucide="${cat.icon}" class="w-5 h-5 text-appTextMuted group-hover:text-appAccent transition-colors flex-shrink-0 mr-3"></i>
                            <span class="font-semibold text-appText text-sm text-left leading-tight flex-1">${cat.label}</span>
                            <span id="badge-${cat.id}" class="ml-2 bg-appBg text-appTextMuted text-[10px] font-bold px-2.5 py-0.5 rounded-full border border-appCardBorder transition-opacity duration-500 opacity-0 shadow-inner"></span>
                        </button>
                    `).join('')}
                </div>
            `;
            document.getElementById('portal-comercial-container').innerHTML = portalHtml;

            function generateAnimatedCards(items) {
                let html = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">';
                items.forEach(item => {
                    let placeholderText = item.name.substring(0, 2).toUpperCase();
                    let logoSrc = item.logo || `https://placehold.co/150x150/${item.hexColor.replace('#','')}/ffffff?text=${placeholderText}`;
                    
                    html += `
                    <div onclick="openIframe('${item.url}', '${item.name}')" class="relative w-full h-[220px] rounded-2xl overflow-hidden shadow-sm hover:shadow-md border border-gray-200 dark:border-gray-800 bg-appCardBg transition-all duration-300 group cursor-pointer">
                        <div class="absolute inset-0 flex flex-col items-center justify-center transition-all duration-300 ease-in-out group-hover:-translate-y-8 group-hover:scale-[0.9] z-10 gap-3">
                            <img src="${logoSrc}" alt="${item.name}" class="w-20 h-20 rounded-2xl shadow-sm object-cover bg-white">
                            <h4 class="font-bold text-appText text-center line-clamp-1 w-[90%] text-base">${item.name}</h4>
                        </div>
                        <div class="absolute inset-x-0 bottom-0 p-4 opacity-0 group-hover:opacity-100 transition-all duration-300 ease-in-out translate-y-4 group-hover:translate-y-0 z-20 flex flex-col items-center text-center justify-end h-full pointer-events-none pb-5">
                            <p class="text-xs text-appTextMuted mb-4 line-clamp-2 w-full px-2">${item.desc}</p>
                            <button class="pointer-events-auto rounded-full py-1.5 px-6 text-sm font-bold text-white w-[80%] max-w-[160px] transition-transform hover:scale-105" style="background-color: ${item.hexColor}">
                                Visitar
                            </button>
                        </div>
                        <div class="absolute inset-0 opacity-0 group-hover:opacity-5 transition-opacity duration-300 z-0 pointer-events-none" style="background-color: ${item.hexColor}"></div>
                    </div>
                    `;
                });
                html += '</div>';
                return html;
            }

            if (COVER_CONFIG.features.showOfertas) {
                const promosSection = document.getElementById('promos-container');
                promosSection.classList.remove('hidden');
                promosSection.innerHTML = `
                    <div class="flex items-center gap-3 mb-6 px-2">
                        <i data-lucide="tags" class="w-7 h-7 text-appAccent"></i>
                        <h3 class="text-2xl font-heading font-bold text-appText">Ofertas y Promociones</h3>
                    </div>
                    ${generateAnimatedCards(config.promos)}
                `;
            }

            if (COVER_CONFIG.features.showMarketplace) {
                const marketplaceSection = document.getElementById('marketplace-container');
                marketplaceSection.classList.remove('hidden');
                marketplaceSection.innerHTML = `
                    <div class="flex items-center gap-3 mb-6 px-2">
                        <i data-lucide="shopping-basket" class="w-7 h-7 text-appAccent"></i>
                        <h3 class="text-2xl font-heading font-bold text-appText">Marketplace</h3>
                    </div>
                    ${generateAnimatedCards(config.marketplace)}
                `;
            }

            if (COVER_CONFIG.features.showAlianzas) {
                const alianzasSection = document.getElementById('alianzas-container');
                alianzasSection.classList.remove('hidden');
                alianzasSection.innerHTML = `
                    <div class="flex items-center gap-3 mb-6 px-2">
                        <i data-lucide="handshake" class="w-7 h-7 text-appAccent"></i>
                        <h3 class="text-2xl font-heading font-bold text-appText">Alianzas Estratégicas</h3>
                    </div>
                    ${generateAnimatedCards(config.alianzas)}
                `;
            }
        }

        initMainContent();
        lucide.createIcons();

        async function loadCategoryCounts() {
            try {
                if (!COVER_CONFIG.global.apiUrl) return;
                const response = await fetch(COVER_CONFIG.global.apiUrl);
                if (!response.ok) throw new Error("HTTP error");
                const data = await response.json();

                const counts = {};
                data.forEach(biz => {
                    if (biz.Category) {
                        const cat = biz.Category.trim();
                        counts[cat] = (counts[cat] || 0) + 1;
                    }
                });

                const categories = COVER_CONFIG.menuGroups.find(g => g.id === "directorio")?.items || [];
                categories.forEach(cat => {
                    const count = counts[cat.id] || 0;
                    const badge = document.getElementById(`badge-${cat.id}`);
                    if (badge) {
                        badge.innerText = count;
                        badge.classList.remove('opacity-0');
                    }
                });
            } catch(error) {
                console.error("Error cargando contadores de categorías:", error);
            }
        }
        
        loadCategoryCounts();

        const appShell = document.getElementById('app-shell');
        const appNav = document.getElementById('app-nav');
        const contentFrame = document.getElementById('content-frame');
        const loadingState = document.getElementById('loading-state');
        const navBrand = document.getElementById('ui-nav-brand');

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar-menu'); 
            const overlay = document.getElementById('mobile-overlay');
            if (sidebar.classList.contains('-translate-x-full')) { 
                sidebar.classList.remove('-translate-x-full'); 
                overlay.classList.remove('hidden'); 
                setTimeout(() => overlay.classList.remove('opacity-0'), 10); 
            } else { 
                sidebar.classList.add('-translate-x-full'); 
                overlay.classList.add('opacity-0'); 
                setTimeout(() => overlay.classList.add('hidden'), 300); 
            }
        }

        contentFrame.addEventListener('load', () => { 
            if(contentFrame.src && contentFrame.src !== "about:blank" && contentFrame.src !== window.location.href) { 
                loadingState.style.display = 'none'; 
                contentFrame.style.opacity = '1'; 
            } 
        });

        function openIframe(url, categoryLabel) {
            const sidebar = document.getElementById('sidebar-menu'); 
            if (!sidebar.classList.contains('-translate-x-full') && window.innerWidth < 1024) { 
                toggleMobileMenu(); 
            }
            
            document.getElementById('main-content-scroll').classList.add('hidden');
            document.getElementById('slider-container').style.opacity = '0';
            
            appShell.classList.remove('hidden'); 
            appNav.classList.remove('hidden'); 
            navBrand.innerText = categoryLabel;
            loadingState.style.display = 'flex'; 
            contentFrame.style.opacity = '0';
            
            contentFrame.src = url;
        }

        function closeIframe() {
            document.getElementById('main-content-scroll').classList.remove('hidden');
            setTimeout(() => document.getElementById('slider-container').style.opacity = '1', 50);
            
            appNav.classList.add('hidden'); 
            appShell.classList.add('hidden'); 
            contentFrame.src = "about:blank"; 
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const ball = document.getElementById('themeToggleBall');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                ball.style.transform = 'translateX(0)';
                ball.innerHTML = '<i data-lucide="moon" class="w-3 h-3 text-appTextMuted" id="themeIcon"></i>';
                localStorage.setItem('theme_preference', 'light');
            } else {
                html.classList.add('dark');
                ball.style.transform = 'translateX(24px)';
                ball.innerHTML = '<i data-lucide="sun" class="w-3 h-3 text-appTextMuted" id="themeIcon"></i>';
                localStorage.setItem('theme_preference', 'dark');
            }
            lucide.createIcons();
        }

        if (localStorage.getItem('theme_preference') === 'dark' || (!('theme_preference' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            toggleDarkMode();
        }
    </script>
</body>
</html>
