    <!-- -->
    <script>
        // 1. INICIALIZAR TEXTOS E IMÁGENES GLOBALES
        document.getElementById('sidebar-brand-logo').src = COVER_CONFIG.global.brandLogoUrl;
        document.getElementById('nav-brand-logo').src = COVER_CONFIG.global.brandLogoUrl;
        document.getElementById('copyright-brand').innerText = COVER_CONFIG.global.brandName;
        document.getElementById('hero-title').innerText = COVER_CONFIG.global.title;
        document.getElementById('ui-btn-back').innerText = COVER_CONFIG.ui.backText;
        document.getElementById('ui-loading-text').innerText = COVER_CONFIG.ui.loadingText;
        document.getElementById('current-year').innerText = new Date().getFullYear();

        // 2. LÓGICA DEL SLIDER VISUAL (3 Segundos)
        let currentSlide = 0;
        let slideInterval;
        const slidesData = COVER_CONFIG.global.slides;

        function initSlider() {
            const container = document.getElementById('slider-container');
            let slidesHTML = ''; let dotsHTML = '';
            
            slidesData.forEach((slide, index) => {
                slidesHTML += `
                <div class="absolute inset-0 transition-opacity duration-1000 ease-in-out z-0 slide-el" id="slide-${index}" style="opacity: ${index === 0 ? '1' : '0'}">
                    <img src="${slide.image}" class="absolute inset-0 w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
                    <div class="absolute inset-0 flex flex-col justify-end p-8 lg:p-16 pb-24 z-10">
                        <h2 class="text-4xl md:text-5xl lg:text-6xl font-heading font-bold text-white mb-4 drop-shadow-lg slide-text" style="opacity: ${index === 0 ? '1' : '0'}; transform: ${index === 0 ? 'translateY(0)' : 'translateY(20px)'}; transition: all 0.8s ease ${index === 0 ? '0.3s' : '0s'}">${slide.title}</h2>
                        <p class="text-lg md:text-xl text-gray-200 font-body mb-8 max-w-2xl slide-text" style="opacity: ${index === 0 ? '1' : '0'}; transform: ${index === 0 ? 'translateY(0)' : 'translateY(20px)'}; transition: all 0.8s ease ${index === 0 ? '0.5s' : '0s'}">${slide.subtitle}</p>
                        <div class="slide-text" style="opacity: ${index === 0 ? '1' : '0'}; transform: ${index === 0 ? 'translateY(0)' : 'translateY(20px)'}; transition: all 0.8s ease ${index === 0 ? '0.7s' : '0s'}">
                            <button onclick="openIframe('${slide.url}', '${slide.label}')" class="bg-appAccent text-white px-6 py-3 lg:px-8 lg:py-4 rounded-xl font-bold font-body uppercase tracking-wider hover:bg-appAccentHover transition-all shadow-lg flex items-center gap-3 w-max group text-sm lg:text-base border border-transparent">
                                ${slide.ctaText} 
                                <i data-lucide="arrow-right" class="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
                dotsHTML += `<button onclick="goToSlide(${index})" class="w-2.5 h-2.5 rounded-full transition-all duration-300 ${index === 0 ? 'bg-appAccent w-8' : 'bg-white/50 hover:bg-white/80'}" id="dot-${index}"></button>`;
            });
            
            container.innerHTML = slidesHTML + `
            <div class="absolute bottom-8 left-0 right-0 flex justify-center gap-2 z-20">${dotsHTML}</div>
            <button onclick="prevSlide()" class="absolute left-4 lg:left-8 top-1/2 -translate-y-1/2 w-10 h-10 lg:w-12 lg:h-12 rounded-full bg-black/20 backdrop-blur-md border border-white/20 text-white flex items-center justify-center hover:bg-black/50 transition z-20"><i data-lucide="chevron-left" class="w-5 h-5 lg:w-6 lg:h-6"></i></button>
            <button onclick="nextSlide()" class="absolute right-4 lg:right-8 top-1/2 -translate-y-1/2 w-10 h-10 lg:w-12 lg:h-12 rounded-full bg-black/20 backdrop-blur-md border border-white/20 text-white flex items-center justify-center hover:bg-black/50 transition z-20"><i data-lucide="chevron-right" class="w-5 h-5 lg:w-6 lg:h-6"></i></button>`;
            
            startAutoSlide();
        }

        function goToSlide(index) {
            if (index < 0) index = slidesData.length - 1;
            if (index >= slidesData.length) index = 0;
            const prevSlideIdx = currentSlide; currentSlide = index;
            
            const prevEl = document.getElementById(`slide-${prevSlideIdx}`);
            if(prevEl) { 
                prevEl.style.opacity = '0'; prevEl.style.zIndex = '0'; 
                prevEl.querySelectorAll('.slide-text').forEach(t => { t.style.opacity = '0'; t.style.transform = 'translateY(20px)'; t.style.transitionDelay = '0s'; }); 
            }
            
            const currEl = document.getElementById(`slide-${currentSlide}`);
            if(currEl) { 
                currEl.style.opacity = '1'; currEl.style.zIndex = '10'; 
                currEl.querySelectorAll('.slide-text').forEach((t, i) => { t.style.transitionDelay = `${0.3 + (i * 0.2)}s`; t.style.opacity = '1'; t.style.transform = 'translateY(0)'; }); 
            }
            
            for (let i = 0; i < slidesData.length; i++) { 
                const dot = document.getElementById(`dot-${i}`); 
                if (dot) dot.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 ${i === currentSlide ? 'bg-appAccent w-8' : 'bg-white/50 hover:bg-white/80'}`; 
            }
            resetAutoSlide();
        }
        function nextSlide() { goToSlide(currentSlide + 1); }
        function prevSlide() { goToSlide(currentSlide - 1); }
        function startAutoSlide() { slideInterval = setInterval(nextSlide, 5000); }
        function resetAutoSlide() { clearInterval(slideInterval); startAutoSlide(); }
        initSlider();

        // 3. GENERADOR DE MENÚ LATERAL (ACORDEONES)
        function createMenuLink(item) {
            return `
                <button onclick="openIframe('${item.url}', '${item.label}')" class="menu-link w-full flex items-center justify-between py-2.5 px-3 rounded-lg text-left text-appTextMuted font-medium font-body group focus:outline-none hover:bg-appBg">
                    <div class="flex items-center gap-3.5">
                        <i data-lucide="${item.icon}" class="w-5 h-5 menu-icon transition-colors"></i>
                        <span class="text-[15px] text-appText">${item.label}</span>
                    </div>
                    <i data-lucide="arrow-right" class="w-4 h-4 text-appAccent opacity-0 group-hover:opacity-100 transition-all -translate-x-2 group-hover:translate-x-0"></i>
                </button>
            `;
        }

        // Filtrar menuGroups basado en los feature flags
        const activeMenuGroups = COVER_CONFIG.menuGroups.filter(group => {
            if (group.id === "ofertasypromos") return COVER_CONFIG.features.showOfertas;
            if (group.id === "marketplace") return COVER_CONFIG.features.showMarketplace;
            if (group.id === "alianzas") return COVER_CONFIG.features.showAlianzas;
            return true; // El portal comercial siempre se muestra
        });

        const menuAccordionHtml = activeMenuGroups.map((group, index) => {
            const isExpanded = group.isOpen === true;
            return `
                <div class="mb-3 border border-appCardBorder rounded-xl overflow-hidden shadow-sm bg-appCardBg">
                    <button onclick="toggleAccordion(${index})" class="w-full flex items-center justify-between p-3.5 bg-appBg hover:opacity-80 transition-opacity focus:outline-none">
                        <div class="flex items-center gap-3">
                            <i data-lucide="${group.icon}" class="w-5 h-5 text-appAccent"></i>
                            <span class="font-bold text-base text-appText">${group.title}</span>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-appTextMuted transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}" id="icon-acc-${index}"></i>
                    </button>
                    <div id="acc-${index}" class="${isExpanded ? 'flex' : 'hidden'} flex-col gap-0.5 p-2 bg-appCardBg border-t border-appCardBorder">
                        ${group.items.map(item => createMenuLink(item)).join('')}
                    </div>
                </div>
            `;
        }).join('');
        
        document.getElementById('menu-accordion-container').innerHTML = menuAccordionHtml;
        document.getElementById('menu-extras').innerHTML = COVER_CONFIG.extras.map(createMenuLink).join('');

        window.toggleAccordion = function(index) {
            const content = document.getElementById('acc-' + index);
            const icon = document.getElementById('icon-acc-' + index);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden'); content.classList.add('flex');
                icon.classList.add('rotate-180');
            } else {
                content.classList.add('hidden'); content.classList.remove('flex');
                icon.classList.remove('rotate-180');
            }
        };

        // 4. GENERADOR DE CONTENIDO PRINCIPAL DINÁMICO
        function initMainContent() {
            const config = COVER_CONFIG.mainContent;

            // --- B. AI Chat ---
            const aiHtml = `
                <div class="w-full rounded-[2rem] bg-gradient-to-br from-blue-600 to-indigo-700 p-8 lg:p-12 shadow-xl relative overflow-hidden flex flex-col lg:flex-row items-center justify-between gap-8">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
                    <div class="relative z-10 w-full lg:w-2/3">
                        <div class="inline-flex items-center gap-2 bg-white/20 backdrop-blur-md border border-white/20 rounded-full px-4 py-1.5 mb-6 text-white text-xs font-bold tracking-wider uppercase">
                            <i data-lucide="sparkles" class="w-4 h-4 text-yellow-300"></i> Búsqueda Conversacional IA
                        </div>
                        <h2 class="text-3xl lg:text-4xl font-heading font-bold text-white mb-4">${config.aiChat.title}</h2>
                        <p class="text-blue-100 font-body text-lg mb-8 max-w-xl">${config.aiChat.subtitle}</p>
                        
                        <div class="relative w-full max-w-2xl">
                            <input type="text" placeholder="${config.aiChat.placeholder}" class="w-full bg-white/10 border border-white/20 rounded-full py-4 pl-6 pr-16 text-white placeholder-blue-200 focus:outline-none focus:bg-white/20 transition-all font-body">
                            <button class="absolute right-2 top-2 bottom-2 aspect-square bg-white text-blue-600 rounded-full flex items-center justify-center hover:bg-blue-50 transition-colors">
                                <i data-lucide="arrow-up" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="relative z-10 w-full lg:w-1/3 flex flex-col items-center lg:items-end gap-4">
                        <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-6 text-center w-full max-w-sm">
                            <div class="text-4xl font-bold text-yellow-400 mb-1">IMPULSAMOS</div>
                            <div class="text-sm font-medium text-blue-100">a MiPyMEs y Profesionales</div>
                        </div>
                        <button onclick="document.getElementById('portal-comercial-container').scrollIntoView({behavior: 'smooth'})" class="w-full max-w-sm border border-white/40 hover:bg-white/10 text-white font-bold py-3.5 rounded-xl transition-colors">
                            ${config.aiChat.btnText}
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('ai-chat-container').innerHTML = aiHtml;

            // --- C. Portal Comercial
            const categories = COVER_CONFIG.menuGroups.find(g => g.id === "directorio")?.items || [];
            const portalHtml = `
                <div class="flex items-center gap-3 mb-6 px-2">
                    <i data-lucide="bookmark-check" class="w-7 h-7 text-appAccent"></i>
                    <h3 class="text-2xl font-heading font-bold text-appText">Portal Comercial</h3>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 lg:gap-4">
                    ${categories.map(cat => `
                        <button onclick="openIframe('${cat.url}', '${cat.label}')" class="flex items-center bg-appCardBg border border-appCardBorder rounded-full py-4 px-6 shadow-sm hover:shadow-md hover:border-appAccent transition-all group w-full focus:outline-none">
                            <i data-lucide="${cat.icon}" class="w-5 h-5 text-appTextMuted group-hover:text-appAccent transition-colors flex-shrink-0 mr-3"></i>
                            <span class="font-semibold text-appText text-sm text-left leading-tight flex-1">${cat.label}</span>
                            <span id="badge-${cat.id}" class="ml-2 bg-appBg text-appTextMuted text-[10px] font-bold px-2.5 py-0.5 rounded-full border border-appCardBorder transition-opacity duration-500 opacity-0 shadow-inner"></span>
                        </button>
                    `).join('')}
                </div>
            `;
            document.getElementById('portal-comercial-container').innerHTML = portalHtml;

            // Helper para las Tarjetas Animadas
            function generateAnimatedCards(items) {
                let html = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">';
                items.forEach(item => {
                    let placeholderText = item.name.substring(0, 2).toUpperCase();
                    let logoSrc = item.logo || `https://placehold.co/150x150/${item.hexColor.replace('#','')}/ffffff?text=${placeholderText}`;
                    
                    html += `
                    <div onclick="openIframe('${item.url}', '${item.name}')" class="relative w-full h-[220px] rounded-2xl overflow-hidden shadow-sm hover:shadow-md border border-gray-200 dark:border-gray-800 bg-appCardBg transition-all duration-300 group cursor-pointer">
                        <div class="absolute inset-0 flex flex-col items-center justify-center transition-all duration-300 ease-in-out group-hover:-translate-y-8 group-hover:scale-[0.9] z-10 gap-3">
                            <img src="${logoSrc}" alt="${item.name}" class="w-20 h-20 rounded-2xl shadow-sm object-cover bg-white">
                            <h4 class="font-bold text-appText text-center line-clamp-1 w-[90%] text-base">${item.name}</h4>
                        </div>
                        <div class="absolute inset-x-0 bottom-0 p-4 opacity-0 group-hover:opacity-100 transition-all duration-300 ease-in-out translate-y-4 group-hover:translate-y-0 z-20 flex flex-col items-center text-center justify-end h-full pointer-events-none pb-5">
                            <p class="text-xs text-appTextMuted mb-4 line-clamp-2 w-full px-2">${item.desc}</p>
                            <button class="pointer-events-auto rounded-full py-1.5 px-6 text-sm font-bold text-white w-[80%] max-w-[160px] transition-transform hover:scale-105" style="background-color: ${item.hexColor}">
                                Visitar
                            </button>
                        </div>
                        <div class="absolute inset-0 opacity-0 group-hover:opacity-5 transition-opacity duration-300 z-0 pointer-events-none" style="background-color: ${item.hexColor}"></div>
                    </div>
                    `;
                });
                html += '</div>';
                return html;
            }

            // --- D. Ofertas y Promociones ---
            if (COVER_CONFIG.features.showOfertas) {
                const promosSection = document.getElementById('promos-container');
                promosSection.classList.remove('hidden');
                promosSection.innerHTML = `
                    <div class="flex items-center gap-3 mb-6 px-2">
                        <i data-lucide="tags" class="w-7 h-7 text-appAccent"></i>
                        <h3 class="text-2xl font-heading font-bold text-appText">Ofertas y Promociones</h3>
                    </div>
                    ${generateAnimatedCards(config.promos)}
                `;
            }

            // --- E. Marketplace ---
            if (COVER_CONFIG.features.showMarketplace) {
                const marketplaceSection = document.getElementById('marketplace-container');
                marketplaceSection.classList.remove('hidden');
                marketplaceSection.innerHTML = `
                    <div class="flex items-center gap-3 mb-6 px-2">
                        <i data-lucide="shopping-basket" class="w-7 h-7 text-appAccent"></i>
                        <h3 class="text-2xl font-heading font-bold text-appText">Marketplace</h3>
                    </div>
                    ${generateAnimatedCards(config.marketplace)}
                `;
            }

            // --- F. Alianzas Estratégicas ---
            if (COVER_CONFIG.features.showAlianzas) {
                const alianzasSection = document.getElementById('alianzas-container');
                alianzasSection.classList.remove('hidden');
                alianzasSection.innerHTML = `
                    <div class="flex items-center gap-3 mb-6 px-2">
                        <i data-lucide="handshake" class="w-7 h-7 text-appAccent"></i>
                        <h3 class="text-2xl font-heading font-bold text-appText">Alianzas Estratégicas</h3>
                    </div>
                    ${generateAnimatedCards(config.alianzas)}
                `;
            }
        }

        // Llamar la generación de contenido principal
        initMainContent();
        lucide.createIcons();

        // --- 5. CARGAR CONTADORES DE CATEGORÍAS (EN SEGUNDO PLANO) ---
        async function loadCategoryCounts() {
            try {
                if (!COVER_CONFIG.global.apiUrl) return;
                const response = await fetch(COVER_CONFIG.global.apiUrl);
                if (!response.ok) throw new Error("HTTP error");
                const data = await response.json();

                // Contar número de perfiles activos por cada categoría
                const counts = {};
                data.forEach(biz => {
                    if (biz.Category) {
                        const cat = biz.Category.trim();
                        counts[cat] = (counts[cat] || 0) + 1;
                    }
                });

                // Actualizar la interfaz (Píldoras) con animación de fundido (fade-in)
                const categories = COVER_CONFIG.menuGroups.find(g => g.id === "directorio")?.items || [];
                categories.forEach(cat => {
                    const count = counts[cat.id] || 0;
                    const badge = document.getElementById(`badge-${cat.id}`);
                    if (badge) {
                        badge.innerText = count;
                        badge.classList.remove('opacity-0');
                    }
                });
            } catch(error) {
                console.error("Error cargando contadores de categorías:", error);
            }
        }
        
        // Ejecutar carga asíncrona para no bloquear el renderizado inicial
        loadCategoryCounts();

        const appShell = document.getElementById('app-shell');
        const appNav = document.getElementById('app-nav');
        const contentFrame = document.getElementById('content-frame');
        const loadingState = document.getElementById('loading-state');
        const navBrand = document.getElementById('ui-nav-brand');

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar-menu'); 
            const overlay = document.getElementById('mobile-overlay');
            if (sidebar.classList.contains('-translate-x-full')) { 
                sidebar.classList.remove('-translate-x-full'); 
                overlay.classList.remove('hidden'); 
                setTimeout(() => overlay.classList.remove('opacity-0'), 10); 
            } else { 
                sidebar.classList.add('-translate-x-full'); 
                overlay.classList.add('opacity-0'); 
                setTimeout(() => overlay.classList.add('hidden'), 300); 
            }
        }

        contentFrame.addEventListener('load', () => { 
            if(contentFrame.src && contentFrame.src !== "about:blank" && contentFrame.src !== window.location.href) { 
                loadingState.style.display = 'none'; 
                contentFrame.style.opacity = '1'; 
            } 
        });

        function openIframe(url, categoryLabel) {
            const sidebar = document.getElementById('sidebar-menu'); 
            if (!sidebar.classList.contains('-translate-x-full') && window.innerWidth < 1024) { 
                toggleMobileMenu(); 
            }
            
            document.getElementById('main-content-scroll').classList.add('hidden');
            document.getElementById('slider-container').style.opacity = '0';
            
            appShell.classList.remove('hidden'); 
            appNav.classList.remove('hidden'); 
            navBrand.innerText = categoryLabel;
            loadingState.style.display = 'flex'; 
            contentFrame.style.opacity = '0';
            
            contentFrame.src = url;
        }

        function closeIframe() {
            document.getElementById('main-content-scroll').classList.remove('hidden');
            setTimeout(() => document.getElementById('slider-container').style.opacity = '1', 50);
            
            appNav.classList.add('hidden'); 
            appShell.classList.add('hidden'); 
            contentFrame.src = "about:blank"; 
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const ball = document.getElementById('themeToggleBall');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                ball.style.transform = 'translateX(0)';
                ball.innerHTML = '<i data-lucide="moon" class="w-3 h-3 text-appTextMuted" id="themeIcon"></i>';
                localStorage.setItem('theme_preference', 'light');
            } else {
                html.classList.add('dark');
                ball.style.transform = 'translateX(24px)';
                ball.innerHTML = '<i data-lucide="sun" class="w-3 h-3 text-appTextMuted" id="themeIcon"></i>';
                localStorage.setItem('theme_preference', 'dark');
            }
            lucide.createIcons();
        }

        if (localStorage.getItem('theme_preference') === 'dark' || (!('theme_preference' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            toggleDarkMode();
        }
    </script>
</body>
</html>
