<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto y Soporte | PUBLIMAPA</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- ======================================================= -->
    <!-- MASTER APP-LESS CONFIGURATION BLOCK                     -->
    <!-- (Todo el contenido, datos de contacto y diseño aquí)    -->
    <!-- ======================================================= -->
    <script>
        const CONFIG = {
            // ---- INFO DE LA PÁGINA ----
            pageTitle: "Soporte y Ayuda",
            pageSubtitle: "Estamos aquí para ayudarte. Elige el medio que prefieras para comunicarte con nuestro equipo.",
            pageIcon: "headset", // Icono principal de Lucide (ej: headset, mail, message-square)
            
            // ---- DATOS DE CONTACTO CONFIGURABLES ----
            contact: {
                // Dirección de correo que recibirá los mensajes del formulario de Email
                emailAddress: "soporte@publimapa.com", 
                // Número de WhatsApp con código de país (sin el '+')
                whatsappNumber: "5215551234567" 
            },

            // ---- TEXTOS DE LOS FORMULARIOS ----
            forms: {
                email: {
                    title: "Envíanos un Correo",
                    description: "Completa el formulario y te responderemos en menos de 24 horas hábiles.",
                    icon: "mail",
                    btnText: "Enviar Email"
                },
                whatsapp: {
                    title: "Chat por WhatsApp",
                    description: "Atención inmediata para resolver tus dudas o problemas rápidamente.",
                    icon: "message-circle",
                    btnText: "Abrir WhatsApp"
                }
            },
            
            // --- ESTÉTICA, COLORES Y TIPOGRAFÍA (Heredado de categoria.html) ---
            theme: {
                // Tipografía desde Google Fonts
                fontUrl: "https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap",
                fontHeading: '"Carlito"', 
                fontBody: '"Carlito"',

                // Modo Claro
                colors: {  
                    bgColor: "#F4F5F4",      
                    textColor: "#1F2937",    
                    accentColor: "#5B7065",  
                    accentHover: "#475950",  
                    cardBg: "#FFFFFF",       
                    cardBorder: "#E5E7EB",   
                    textMuted: "#6B7280",    
                    btnBg: "#FFFFFF",        
                    btnBorder: "#D1D5DB"     
                },

                // Modo Oscuro
                darkColors: {
                    bgColor: "#121212",      
                    textColor: "#F3F4F6",    
                    accentColor: "#10B981",  
                    accentHover: "#059669",  
                    cardBg: "#1E1E1E",       
                    cardBorder: "#333333",   
                    textMuted: "#9CA3AF",    
                    btnBg: "#2A2A2A",        
                    btnBorder: "#404040"     
                },
                
                // Colores especiales
                specialColors: {
                    whatsappBg: "#25D366",
                    whatsappHover: "#128C7E"
                }
            }
        };

        // --- INYECCIÓN DINÁMICA DE FUENTES Y VARIABLES CSS ---
        const fontLink = document.createElement('link');
        fontLink.href = CONFIG.theme.fontUrl;
        fontLink.rel = "stylesheet";
        document.head.appendChild(fontLink);

        const styleVars = document.createElement('style');
        styleVars.innerHTML = `
            :root {
                --c-bg: ${CONFIG.theme.colors.bgColor};
                --c-text: ${CONFIG.theme.colors.textColor};
                --c-accent: ${CONFIG.theme.colors.accentColor};
                --c-accent-hover: ${CONFIG.theme.colors.accentHover};
                --c-card-bg: ${CONFIG.theme.colors.cardBg};
                --c-card-border: ${CONFIG.theme.colors.cardBorder};
                --c-text-muted: ${CONFIG.theme.colors.textMuted};
                --c-btn-bg: ${CONFIG.theme.colors.btnBg};
                --c-btn-border: ${CONFIG.theme.colors.btnBorder};
                --c-wa: ${CONFIG.theme.specialColors.whatsappBg};
                --c-wa-hover: ${CONFIG.theme.specialColors.whatsappHover};
            }
            html.dark {
                --c-bg: ${CONFIG.theme.darkColors.bgColor};
                --c-text: ${CONFIG.theme.darkColors.textColor};
                --c-accent: ${CONFIG.theme.darkColors.accentColor};
                --c-accent-hover: ${CONFIG.theme.darkColors.accentHover};
                --c-card-bg: ${CONFIG.theme.darkColors.cardBg};
                --c-card-border: ${CONFIG.theme.darkColors.cardBorder};
                --c-text-muted: ${CONFIG.theme.darkColors.textMuted};
                --c-btn-bg: ${CONFIG.theme.darkColors.btnBg};
                --c-btn-border: ${CONFIG.theme.darkColors.btnBorder};
            }
        `;
        document.head.appendChild(styleVars);

        // --- CONFIGURACIÓN TAILWIND ---
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        appBg: 'var(--c-bg)',
                        appText: 'var(--c-text)',
                        appAccent: 'var(--c-accent)',
                        appAccentHover: 'var(--c-accent-hover)',
                        appCardBg: 'var(--c-card-bg)',
                        appCardBorder: 'var(--c-card-border)',
                        appTextMuted: 'var(--c-text-muted)',
                        appBtnBg: 'var(--c-btn-bg)',
                        appBtnBorder: 'var(--c-btn-border)',
                        appWa: 'var(--c-wa)',
                        appWaHover: 'var(--c-wa-hover)'
                    },
                    fontFamily: {
                        heading: [CONFIG.theme.fontHeading, 'serif'],
                        body: [CONFIG.theme.fontBody, 'sans-serif']
                    }
                }
            }
        };
    </script>

    <style>
        /* Estilos base utilizando nuestras variables inyectadas */
        body { font-family: theme('fontFamily.body'); }
        h1, h2, h3, h4, .font-heading { font-family: theme('fontFamily.heading'); }
        
        /* Ajuste para inputs en Dark Mode para evitar fondos blancos duros */
        html.dark input, html.dark textarea { 
            background-color: var(--c-bg); 
            color: var(--c-text); 
            border-color: var(--c-card-border); 
        }
        
        /* Estilos genéricos para inputs */
        .app-input {
            width: 100%; padding: 0.75rem 1rem; border-radius: 0.5rem; border-width: 1px;
            background-color: var(--c-bg); border-color: var(--c-card-border); color: var(--c-text);
            transition: all 0.2s ease-in-out; font-size: 0.875rem;
        }
        .app-input:focus {
            outline: none; box-shadow: 0 0 0 2px var(--c-accent); border-color: transparent;
        }
        .app-label {
            display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--c-text-muted); margin-bottom: 0.375rem;
        }
    </style>
</head>
<body class="bg-appBg text-appText min-h-screen flex flex-col antialiased transition-colors duration-300">

    <!-- TOP HEADER / THEME TOGGLE -->
    <div class="max-w-6xl mx-auto px-6 pt-6 flex justify-end w-full">
        <div class="flex items-center justify-center w-12 h-6 bg-appCardBorder rounded-full relative cursor-pointer border border-appTextMuted/20 transition-colors" onclick="toggleDarkMode()">
            <div id="themeToggleBall" class="absolute left-1 top-1 bg-appBtnBg w-4 h-4 rounded-full transition-transform duration-200 ease-in-out flex items-center justify-center shadow-sm">
                <i data-lucide="moon" class="w-3 h-3 text-appTextMuted" id="themeIcon"></i>
            </div>
        </div>
    </div>

    <!-- MAIN HEADER -->
    <header class="py-6 sm:py-8">
        <div class="max-w-4xl mx-auto px-4 flex flex-col items-center text-center">
            <div class="flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4 text-appAccent mb-3 sm:mb-4 max-w-full">
                <i id="headerIcon" class="w-12 h-12 flex-shrink-0"></i>
                <h1 class="text-3xl sm:text-4xl font-bold font-heading text-appText text-center leading-tight" id="appTitle"></h1>
            </div>
            <p class="text-appTextMuted text-base sm:text-lg max-w-2xl" id="appSubtitle"></p>
        </div>
    </header>

    <!-- MAIN CONTENT (FORMS GRID) -->
    <main class="flex-grow w-full max-w-5xl mx-auto px-4 py-4 sm:py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
            
            <!-- FORMULARIO 1: CORREO ELECTRÓNICO -->
            <div class="bg-appCardBg border border-appCardBorder rounded-2xl shadow-sm overflow-hidden transition-all duration-300 hover:shadow-md">
                <div class="p-6 sm:p-8 border-b border-appCardBorder bg-appBg/50 flex flex-col items-center text-center">
                    <div class="w-14 h-14 bg-appAccent/10 rounded-full flex items-center justify-center mb-4">
                        <i id="emailIcon" class="w-6 h-6 text-appAccent"></i>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-bold font-heading text-appText mb-2" id="emailTitle"></h2>
                    <p class="text-sm text-appTextMuted" id="emailDesc"></p>
                </div>
                
                <form id="emailForm" class="p-6 sm:p-8 space-y-5" onsubmit="handleEmailSubmit(event)">
                    <div>
                        <label class="app-label" for="emailName">Nombre Completo</label>
                        <input type="text" id="emailName" required class="app-input" placeholder="Ej. Juan Pérez">
                    </div>
                    <div>
                        <label class="app-label" for="emailAddress">Tu Correo Electrónico</label>
                        <input type="email" id="emailAddress" required class="app-input" placeholder="juan@ejemplo.com">
                    </div>
                    <div>
                        <label class="app-label" for="emailSubject">Asunto</label>
                        <input type="text" id="emailSubject" required class="app-input" placeholder="¿En qué podemos ayudarte?">
                    </div>
                    <div>
                        <label class="app-label" for="emailMessage">Mensaje</label>
                        <textarea id="emailMessage" required rows="4" class="app-input resize-none" placeholder="Describe los detalles aquí..."></textarea>
                    </div>
                    
                    <button type="submit" class="w-full bg-appAccent hover:bg-appAccentHover text-white font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-colors shadow-sm mt-4">
                        <i data-lucide="send" class="w-5 h-5"></i>
                        <span id="emailBtnText"></span>
                    </button>
                </form>
            </div>

            <!-- FORMULARIO 2: WHATSAPP -->
            <div class="bg-appCardBg border border-appCardBorder rounded-2xl shadow-sm overflow-hidden transition-all duration-300 hover:shadow-md">
                <div class="p-6 sm:p-8 border-b border-appCardBorder bg-appWa/5 flex flex-col items-center text-center">
                    <div class="w-14 h-14 bg-appWa/10 rounded-full flex items-center justify-center mb-4">
                        <i id="waIcon" class="w-6 h-6 text-appWa"></i>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-bold font-heading text-appText mb-2" id="waTitle"></h2>
                    <p class="text-sm text-appTextMuted" id="waDesc"></p>
                </div>
                
                <form id="waForm" class="p-6 sm:p-8 space-y-5" onsubmit="handleWaSubmit(event)">
                    <div>
                        <label class="app-label" for="waName">Nombre Completo</label>
                        <input type="text" id="waName" required class="app-input" placeholder="Ej. Juan Pérez">
                    </div>
                    <div>
                        <label class="app-label" for="waMessage">Mensaje para WhatsApp</label>
                        <textarea id="waMessage" required rows="5" class="app-input resize-none" placeholder="Escribe tu consulta y te responderemos por chat de inmediato..."></textarea>
                    </div>
                    
                    <button type="submit" class="w-full bg-appWa hover:bg-appWaHover text-white font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-colors shadow-sm mt-4">
                        <i data-lucide="message-circle" class="w-5 h-5"></i>
                        <span id="waBtnText"></span>
                    </button>
                </form>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-appCardBorder bg-transparent py-8 mt-auto transition-colors">
        <div class="max-w-5xl mx-auto px-6 flex justify-center items-center">
            <p class="text-appTextMuted text-sm text-center">
                &copy; <span id="currentYear"></span> PUBLIMAPA®. Todos los derechos reservados.
            </p>
        </div>
    </footer>

    <!-- LÓGICA DE LA PÁGINA Y FORMULARIOS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Inyectar datos de Configuración en el DOM
            document.getElementById('appTitle').textContent = CONFIG.pageTitle;
            document.getElementById('appSubtitle').textContent = CONFIG.pageSubtitle;
            document.getElementById('headerIcon').setAttribute('data-lucide', CONFIG.pageIcon);
            document.getElementById('currentYear').textContent = new Date().getFullYear();

            // Config Form Email
            document.getElementById('emailTitle').textContent = CONFIG.forms.email.title;
            document.getElementById('emailDesc').textContent = CONFIG.forms.email.description;
            document.getElementById('emailIcon').setAttribute('data-lucide', CONFIG.forms.email.icon);
            document.getElementById('emailBtnText').textContent = CONFIG.forms.email.btnText;

            // Config Form WA
            document.getElementById('waTitle').textContent = CONFIG.forms.whatsapp.title;
            document.getElementById('waDesc').textContent = CONFIG.forms.whatsapp.description;
            document.getElementById('waIcon').setAttribute('data-lucide', CONFIG.forms.whatsapp.icon);
            document.getElementById('waBtnText').textContent = CONFIG.forms.whatsapp.btnText;

            // 2. Inicializar iconos
            lucide.createIcons();

            // 3. Inicializar preferencias de Dark Mode
            checkInitialTheme();
        });

        // --- DARK MODE LOGIC ---
        function checkInitialTheme() {
            const isDark = localStorage.getItem('theme_preference') === 'dark' || 
                           (!('theme_preference' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) toggleDarkMode(true); // Fuerza el modo oscuro si es la preferencia
        }

        function toggleDarkMode(forceDark = false) {
            const html = document.documentElement;
            const ball = document.getElementById('themeToggleBall');
            const icon = document.getElementById('themeIcon');
            
            if (html.classList.contains('dark') && !forceDark) {
                // Cambiar a Modo Claro
                html.classList.remove('dark');
                ball.style.transform = 'translateX(0)';
                icon.setAttribute('data-lucide', 'moon');
                localStorage.setItem('theme_preference', 'light');
            } else {
                // Cambiar a Modo Oscuro
                html.classList.add('dark');
                ball.style.transform = 'translateX(24px)';
                icon.setAttribute('data-lucide', 'sun');
                localStorage.setItem('theme_preference', 'dark');
            }
            lucide.createIcons();
        }

        // --- MANEJO DE FORMULARIO: EMAIL ---
        function handleEmailSubmit(event) {
            event.preventDefault(); // Evitar recarga de página

            const name = document.getElementById('emailName').value.trim();
            const email = document.getElementById('emailAddress').value.trim();
            const subject = document.getElementById('emailSubject').value.trim();
            const rawMessage = document.getElementById('emailMessage').value.trim();

            // Construir el cuerpo del correo preformateado
            const body = `Nombre: ${name}%0D%0AEmail de contacto: ${email}%0D%0A%0D%0AMensaje:%0D%0A${rawMessage.replace(/\n/g, '%0D%0A')}`;
            
            // Redirigir al cliente de correo nativo usando el email de la configuración
            const mailtoLink = `mailto:${CONFIG.contact.emailAddress}?subject=${encodeURIComponent(subject)}&body=${body}`;
            window.location.href = mailtoLink;
            
            // Limpiar formulario opcionalmente
            document.getElementById('emailForm').reset();
        }

        // --- MANEJO DE FORMULARIO: WHATSAPP ---
        function handleWaSubmit(event) {
            event.preventDefault(); // Evitar recarga de página

            const name = document.getElementById('waName').value.trim();
            const rawMessage = document.getElementById('waMessage').value.trim();

            // Construir el mensaje formateado para WhatsApp
            const waText = encodeURIComponent(`Hola equipo de Soporte.\n\nSoy ${name}.\n\n${rawMessage}`);
            
            // Generar link de wa.me usando el número de la configuración
            const waUrl = `https://wa.me/${CONFIG.contact.whatsappNumber}?text=${waText}`;
            
            // Abrir WhatsApp en una nueva pestaña
            window.open(waUrl, '_blank');
            
            // Limpiar formulario opcionalmente
            document.getElementById('waForm').reset();
        }
    </script>
</body>
</html>
