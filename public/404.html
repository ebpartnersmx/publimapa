<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada | PUBLIMAPA</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- ======================================================= -->
    <!-- MASTER APP-LESS CONFIGURATION BLOCK                     -->
    <!-- (Todo el contenido y diseño se controla aquí)           -->
    <!-- ======================================================= -->
    <script>
        const CONFIG = {
            // ---- INFO DE LA PÁGINA DE ERROR ----
            pageTitle: "404",
            error: {
                title: "Página no encontrada",
                description: "Parece que te has salido del mapa. La página que estás buscando no existe, ha sido movida o no está disponible temporalmente.",
                icon: "map-pin-off", // Icono principal de Lucide para ilustrar el error
                btnText: "Volver al Inicio",
                btnActionUrl: "index.html", // URL a la que redirigirá el botón
                fallbackAction: "history.back()" // Acción JavaScript secundaria si no hay historial
            },
            
            // --- ESTÉTICA, COLORES Y TIPOGRAFÍA (Heredado de categoria.html) ---
            theme: {
                // Tipografía desde Google Fonts
                fontUrl: "https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap",
                fontHeading: '"Carlito"', 
                fontBody: '"Carlito"',

                // Modo Claro
                colors: {  
                    bgColor: "#F4F5F4",      
                    textColor: "#1F2937",    
                    accentColor: "#5B7065",  
                    accentHover: "#475950",  
                    cardBg: "#FFFFFF",       
                    cardBorder: "#E5E7EB",   
                    textMuted: "#6B7280",    
                    btnBg: "#FFFFFF",        
                    btnBorder: "#D1D5DB"     
                },

                // Modo Oscuro
                darkColors: {
                    bgColor: "#121212",      
                    textColor: "#F3F4F6",    
                    accentColor: "#10B981",  
                    accentHover: "#059669",  
                    cardBg: "#1E1E1E",       
                    cardBorder: "#333333",   
                    textMuted: "#9CA3AF",    
                    btnBg: "#2A2A2A",        
                    btnBorder: "#404040"     
                },
                
                // Colores especiales (mantenidos para compatibilidad estructural)
                specialColors: {
                    whatsappBg: "#25D366",
                    whatsappHover: "#128C7E"
                }
            }
        };

        // --- INYECCIÓN DINÁMICA DE FUENTES Y VARIABLES CSS ---
        const fontLink = document.createElement('link');
        fontLink.href = CONFIG.theme.fontUrl;
        fontLink.rel = "stylesheet";
        document.head.appendChild(fontLink);

        const styleVars = document.createElement('style');
        styleVars.innerHTML = `
            :root {
                --c-bg: ${CONFIG.theme.colors.bgColor};
                --c-text: ${CONFIG.theme.colors.textColor};
                --c-accent: ${CONFIG.theme.colors.accentColor};
                --c-accent-hover: ${CONFIG.theme.colors.accentHover};
                --c-card-bg: ${CONFIG.theme.colors.cardBg};
                --c-card-border: ${CONFIG.theme.colors.cardBorder};
                --c-text-muted: ${CONFIG.theme.colors.textMuted};
                --c-btn-bg: ${CONFIG.theme.colors.btnBg};
                --c-btn-border: ${CONFIG.theme.colors.btnBorder};
                --c-wa: ${CONFIG.theme.specialColors.whatsappBg};
                --c-wa-hover: ${CONFIG.theme.specialColors.whatsappHover};
            }
            html.dark {
                --c-bg: ${CONFIG.theme.darkColors.bgColor};
                --c-text: ${CONFIG.theme.darkColors.textColor};
                --c-accent: ${CONFIG.theme.darkColors.accentColor};
                --c-accent-hover: ${CONFIG.theme.darkColors.accentHover};
                --c-card-bg: ${CONFIG.theme.darkColors.cardBg};
                --c-card-border: ${CONFIG.theme.darkColors.cardBorder};
                --c-text-muted: ${CONFIG.theme.darkColors.textMuted};
                --c-btn-bg: ${CONFIG.theme.darkColors.btnBg};
                --c-btn-border: ${CONFIG.theme.darkColors.btnBorder};
            }
        `;
        document.head.appendChild(styleVars);

        // --- CONFIGURACIÓN TAILWIND ---
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        appBg: 'var(--c-bg)',
                        appText: 'var(--c-text)',
                        appAccent: 'var(--c-accent)',
                        appAccentHover: 'var(--c-accent-hover)',
                        appCardBg: 'var(--c-card-bg)',
                        appCardBorder: 'var(--c-card-border)',
                        appTextMuted: 'var(--c-text-muted)',
                        appBtnBg: 'var(--c-btn-bg)',
                        appBtnBorder: 'var(--c-btn-border)',
                        appWa: 'var(--c-wa)',
                        appWaHover: 'var(--c-wa-hover)'
                    },
                    fontFamily: {
                        heading: [CONFIG.theme.fontHeading, 'serif'],
                        body: [CONFIG.theme.fontBody, 'sans-serif']
                    }
                }
            }
        };
    </script>

    <style>
        /* Estilos base utilizando nuestras variables inyectadas */
        body { font-family: theme('fontFamily.body'); }
        h1, h2, h3, h4, .font-heading { font-family: theme('fontFamily.heading'); }
        
        /* Animación suave para el número 404 */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-appBg text-appText min-h-screen flex flex-col antialiased transition-colors duration-300">

    <!-- TOP HEADER / THEME TOGGLE -->
    <div class="max-w-6xl mx-auto px-6 pt-6 flex justify-end w-full absolute top-0 right-0 z-10">
        <div class="flex items-center justify-center w-12 h-6 bg-appCardBorder rounded-full relative cursor-pointer border border-appTextMuted/20 transition-colors" onclick="toggleDarkMode()">
            <div id="themeToggleBall" class="absolute left-1 top-1 bg-appBtnBg w-4 h-4 rounded-full transition-transform duration-200 ease-in-out flex items-center justify-center shadow-sm">
                <i data-lucide="moon" class="w-3 h-3 text-appTextMuted" id="themeIcon"></i>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT (404 ERROR) -->
    <main class="flex-grow flex items-center justify-center w-full px-4 py-12 relative overflow-hidden">
        
        <!-- Elementos decorativos de fondo (Opcionales, dan un toque premium) -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-appAccent/5 rounded-full blur-3xl pointer-events-none transition-colors duration-300"></div>

        <div class="max-w-md w-full bg-appCardBg border border-appCardBorder rounded-3xl shadow-sm hover:shadow-md transition-all duration-300 p-8 sm:p-10 text-center relative z-10">
            
            <!-- Graphic / Icon -->
            <div class="flex justify-center mb-6 relative">
                <div class="w-24 h-24 sm:w-28 sm:h-28 bg-appBg rounded-full flex items-center justify-center border-4 border-appCardBg shadow-inner relative z-10 animate-float">
                    <i id="errorIcon" class="w-10 h-10 sm:w-12 sm:h-12 text-appAccent"></i>
                </div>
                <!-- Número 404 de fondo -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-8xl sm:text-9xl font-black text-appCardBorder/40 select-none z-0 tracking-tighter" id="bgErrorCode"></div>
            </div>

            <!-- Texts -->
            <h1 class="text-2xl sm:text-3xl font-bold font-heading text-appText mb-3 leading-tight" id="errorTitle"></h1>
            <p class="text-appTextMuted text-sm sm:text-base mb-8 leading-relaxed px-2" id="errorDesc"></p>
            
            <!-- Actions -->
            <div class="flex flex-col gap-3">
                <button onclick="handleGoBack()" class="w-full bg-appAccent hover:bg-appAccentHover text-white font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-appAccent focus:ring-offset-2 focus:ring-offset-appCardBg">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    <span id="errorBtnText"></span>
                </button>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-appCardBorder bg-transparent py-6 mt-auto transition-colors z-10 relative">
        <div class="max-w-5xl mx-auto px-6 flex justify-center items-center">
            <p class="text-appTextMuted text-xs sm:text-sm text-center">
                &copy; <span id="currentYear"></span> PUBLIMAPA®. Todos los derechos reservados.
            </p>
        </div>
    </footer>

    <!-- LÓGICA DE LA PÁGINA -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Inyectar datos de Configuración en el DOM
            document.title = `${CONFIG.pageTitle} - ${CONFIG.error.title} | PUBLIMAPA`;
            
            document.getElementById('bgErrorCode').textContent = CONFIG.pageTitle;
            document.getElementById('errorTitle').textContent = CONFIG.error.title;
            document.getElementById('errorDesc').textContent = CONFIG.error.description;
            document.getElementById('errorIcon').setAttribute('data-lucide', CONFIG.error.icon);
            document.getElementById('errorBtnText').textContent = CONFIG.error.btnText;
            document.getElementById('currentYear').textContent = new Date().getFullYear();

            // 2. Inicializar iconos
            lucide.createIcons();

            // 3. Inicializar preferencias de Dark Mode
            checkInitialTheme();
        });

        // --- DARK MODE LOGIC ---
        function checkInitialTheme() {
            const isDark = localStorage.getItem('theme_preference') === 'dark' || 
                           (!('theme_preference' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) toggleDarkMode(true); // Fuerza el modo oscuro si es la preferencia
        }

        function toggleDarkMode(forceDark = false) {
            const html = document.documentElement;
            const ball = document.getElementById('themeToggleBall');
            const icon = document.getElementById('themeIcon');
            
            if (html.classList.contains('dark') && !forceDark) {
                // Cambiar a Modo Claro
                html.classList.remove('dark');
                ball.style.transform = 'translateX(0)';
                icon.setAttribute('data-lucide', 'moon');
                localStorage.setItem('theme_preference', 'light');
            } else {
                // Cambiar a Modo Oscuro
                html.classList.add('dark');
                ball.style.transform = 'translateX(24px)';
                icon.setAttribute('data-lucide', 'sun');
                localStorage.setItem('theme_preference', 'dark');
            }
            lucide.createIcons();
        }

        // --- NAVEGACIÓN ---
        function handleGoBack() {
            // Intenta volver en el historial. 
            // Si el historial es 1 (nueva pestaña o acceso directo), redirige al index configurado.
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = CONFIG.error.btnActionUrl;
            }
        }
    </script>
</body>
</html>
