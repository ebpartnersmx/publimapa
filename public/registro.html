<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta Directorio Publimapa</title>

    <!-- ==========================================
         MASTER APP-LESS CONFIGURATION BLOCK
         Todo el contenido, diseño y funcionalidad 
         se controla desde este único objeto.
         ========================================== -->
    <script>
        const APP_CONFIG = {
            // --- 1. BRANDING & TEXTOS DE PÁGINA ---
            branding: {
                pageTitle: "Registra tu Negocio o Empresa",
                pageSubtitle: "Únete a nuestro directorio. Comienza a recibir clientes potenciales directamente en tu WhatsApp.",
                successModalTitle: "¡Registro Exitoso!",
                successModalText: "Tu perfil ha sido enviado y las imágenes están siendo procesadas. En breve estarás visible en el directorio.",
                btnSubmit: "Crear Perfil de Negocio",
                btnDirectory: "Ver Directorio",
                btnRegisterAnother: "Registrar Otro"
            },

            // --- 2. MAPEO DE BASE DE DATOS (ETIQUETAS Y PLACEHOLDERS) ---
            // Los 'name' en el HTML coinciden exactamente con database_setup_script.py
            formLabels: {
                uniqueId: "Correo Electrónico (Unique_ID) *",
                profileName: "Nombre del Negocio *",
                slug: "Enlace del Perfil (Slug URL) *",
                category: "Categoría Principal *",
                zone: "Dirección Completa (Calle, Número, Colonia, Ciudad) *",
                profileTitle: "Eslogan o Título Corto *",
                description: "Descripción Completa *",
                whatsapp: "Número de WhatsApp *",
                mapUrl: "Enlace de Google Maps (Opcional)",
                logo: "Logotipo (1 foto, máx. 2MB) *",
                logoHelp: "Formato cuadrado sugerido.",
                images: "Galería (Máx. 3 fotos, 2MB c/u) *",
                imagesDrag: "Arrastra tus fotos o haz clic aquí",
                imagesHelp: "Formatos: JPG, PNG, WEBP."
            },
            formPlaceholders: {
                uniqueId: "contacto@tunegocio.com",
                profileName: "Ej. Botánica Urbana",
                zone: "Ej. Av. Insurgentes Sur 123, Roma Norte, CDMX",
                profileTitle: "Especialistas en plantas de interior y diseño",
                description: "Describe tus servicios, horarios y lo que te hace único...",
                whatsapp: "5215512345678",
                mapUrl: "https://goo.gl/maps/..."
            },

            // --- 3. LISTAS DESPLEGABLES ---
            // Se actualizó para usar el patrón de { id, label } sincronizado con el AppShell
            dropdowns: {
                categories: [
                    { id: "automotriz", label: "Automotriz" },
                    { id: "belleza", label: "Belleza y Bienestar" },
                    { id: "construccion", label: "Bienes Raices y Construcción" },
                    { id: "cafe", label: "Café y Postres" },
                    { id: "casa", label: "Casa y Decoración" },
                    { id: "computacion", label: "Computación y Electrónica" },
                    { id: "decompras", label: "De Compras y Regalos" },
                    { id: "deportes", label: "Deportes y Gimnasios" },
                    { id: "educacion", label: "Educación y Aprendizaje" },
                    { id: "hoteles", label: "Hoteles y Hospedajes" },
                    { id: "mascotas", label: "Mascotas" },
                    { id: "medicina", label: "Medicina y Salud" },
                    { id: "oficios", label: "Oficios y Mantenimiento" },
                    { id: "restaurantes", label: "Restaurantes y Comida" },
                    { id: "profesionales", label: "Servicios Profesionales" },
                    { id: "tecnologia", label: "Tecnología y Comunicación" },
                    { id: "tiempolibre", label: "Tiempo Libre" },
                    { id: "viajes", label: "Viajes y Turismo" },
                    { id: "vidanocturna", label: "Vida Nocturna y Bares" }
                ]
            },

            // --- 4. ESTÉTICA, COLORES Y TIPOGRAFÍA ---
            theme: {
                // Tipografía desde Google Fonts
                fontUrl: "https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap",
                fontHeading: '"Carlito"', 
                fontBody: '"Carlito"',

                // Scandinavian slate (Modo Claro)
                colors: {  
                    bgColor: "#F4F5F4",     
                    textColor: "#1F2937",   
                    accentColor: "#5B7065", 
                    accentHover: "#475950", 
                    cardBg: "#FFFFFF",      
                    cardBorder: "#E5E7EB",  
                    textMuted: "#6B7280",   
                    inputBg: "#F9FAFB",
                    btnBg: "#FFFFFF",       
                    btnBorder: "#D1D5DB"    
                },

                // Modern Dark (Modo Oscuro)
                darkColors: {
                    bgColor: "#121212",     
                    textColor: "#F3F4F6",   
                    accentColor: "#10B981", 
                    accentHover: "#059669", 
                    cardBg: "#1E1E1E",      
                    cardBorder: "#333333",  
                    textMuted: "#9CA3AF",   
                    inputBg: "#2A2A2A",
                    btnBg: "#2A2A2A",       
                    btnBorder: "#404040"    
                }
            },

            // --- 5. BASE DE DATOS Y CONEXIONES ---
            data: {
                // WEBHOOK PIPELINE A: Debe tener "Allow file uploads" activado en SheetMonkey
                sheetMonkeyUrl: "https://api.sheetmonkey.io/form/pCxKymQAAoHHZozp7NhQkv"
            }
        };

        // ==========================================
        // AUTO-INYECCIÓN DE TEMA (SIN DESTELLOS)
        // ==========================================
        if (APP_CONFIG.theme.fontUrl) {
            document.write(`<link rel="preconnect" href="https://fonts.googleapis.com">`);
            document.write(`<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>`);
            document.write(`<link href="${APP_CONFIG.theme.fontUrl}" rel="stylesheet">`);
        }

        let cssString = ':root {\n';
        Object.keys(APP_CONFIG.theme.colors).forEach(key => {
            const cssVar = '--' + key.replace(/([a-z0-9]|(?=[A-Z]))([A-Z])/g, '$1-$2').toLowerCase();
            cssString += `  ${cssVar}: ${APP_CONFIG.theme.colors[key]};\n`;
        });
        cssString += '}\n\n.dark {\n';
        Object.keys(APP_CONFIG.theme.darkColors).forEach(key => {
            const cssVar = '--' + key.replace(/([a-z0-9]|(?=[A-Z]))([A-Z])/g, '$1-$2').toLowerCase();
            cssString += `  ${cssVar}: ${APP_CONFIG.theme.darkColors[key]};\n`;
        });
        cssString += '}\n';

        const styleTag = document.createElement('style');
        styleTag.innerHTML = cssString;
        document.head.appendChild(styleTag);
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class', 
            theme: {
                extend: {
                    colors: {
                        page: 'var(--bg-color)',
                        main: 'var(--text-color)',
                        muted: 'var(--text-muted)',
                        card: 'var(--card-bg)',
                        'card-border': 'var(--card-border)',
                        'input-bg': 'var(--input-bg)',
                        accent: 'var(--accent-color)',
                        'accent-hover': 'var(--accent-hover)'
                    },
                    fontFamily: {
                        sans: [APP_CONFIG.theme.fontBody, 'sans-serif'],
                        serif: [APP_CONFIG.theme.fontHeading, 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { -webkit-font-smoothing: antialiased; }
        .form-input {
            width: 100%; padding: 0.875rem 1rem; border-radius: 0.75rem;
            border: 1px solid var(--card-border); background-color: var(--input-bg); 
            color: var(--text-color); transition: all 0.2s; outline: none; font-family: var(--font-sans);
        }
        .form-input:focus { 
            border-color: var(--accent-color); 
            box-shadow: 0 0 0 3px rgba(91, 112, 101, 0.15); 
        }
        .dark .form-input:focus {
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); 
        }
        .form-label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-color); }
    </style>
</head>
<body class="bg-page text-main min-h-screen flex items-center justify-center py-12 px-4 relative transition-colors duration-300 font-sans">

    <!-- Theme Toggle -->
    <button onclick="toggleTheme()" class="fixed top-6 right-6 w-16 h-8 rounded-full bg-gray-300 dark:bg-gray-700 shadow-inner flex items-center px-1 transition-colors duration-300 z-50 focus:outline-none">
        <div class="absolute left-2 text-yellow-500 text-xs pointer-events-none"><i class="fas fa-sun"></i></div>
        <div class="absolute right-2 text-indigo-300 text-xs pointer-events-none"><i class="fas fa-moon"></i></div>
        <div id="theme-thumb" class="w-6 h-6 bg-white rounded-full shadow-md z-10 transition-transform duration-300 transform dark:translate-x-8"></div>
    </button>

    <div class="max-w-4xl w-full bg-card rounded-2xl shadow-xl overflow-hidden border border-card-border transition-colors duration-300">
        
        <!-- Header -->
        <div class="bg-accent p-10 text-white text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
            <h1 id="ui-page-title" class="text-4xl font-serif font-bold mb-3 relative z-10"></h1>
            <p id="ui-page-subtitle" class="text-white/80 font-light text-lg max-w-2xl mx-auto relative z-10"></p>
        </div>

        <!-- Hidden iframe to bypass CORS and prevent page reload -->
        <iframe name="hiddenConfirm" id="hiddenConfirm" style="display:none;"></iframe>

        <!-- Main Form -->
        <form id="onboardingForm" method="POST" enctype="multipart/form-data" target="hiddenConfirm" class="p-8 sm:p-10">
            
            <!-- Hidden configuration fields required by the Playbook -->
            <input type="hidden" name="Timestamp" value="x-sheetmonkey-current-date-time" />
            <input type="hidden" name="x-sheetmonkey-insert-worksheet" value="Negocios" />

            <!-- The 4 hidden file inputs mapped to Python script columns -->
            <input type="file" name="Image" id="hf1" class="hidden">
            <input type="file" name="Image2" id="hf2" class="hidden">
            <input type="file" name="Image3" id="hf3" class="hidden">
            <input type="file" name="Image4" id="hf4" class="hidden">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-7">
                
                <!-- Identificador Principal / Facturación -->
                <div class="md:col-span-2 p-5 rounded-xl border border-accent/20 bg-accent/5">
                    <label id="lbl-unique-id" class="form-label text-accent flex items-center gap-2">
                        <i class="fas fa-envelope"></i> <span></span>
                    </label>
                    <input type="email" id="input-unique-id" name="Unique_ID" class="form-input mt-2" required>
                    <p class="text-xs text-muted mt-2"><i class="fas fa-info-circle mr-1"></i> Este correo se usa para acreditar los leads y como tu identificador de cliente.</p>
                </div>

                <!-- Perfil Básico -->
                <div class="md:col-span-2">
                    <label id="lbl-profile-name" class="form-label"></label>
                    <input type="text" id="input-profile-name" name="ProfileName" class="form-input" required>
                </div>
                
                <!-- Slug Autogenerado -->
                <div class="md:col-span-2 -mt-3">
                    <label id="lbl-slug" class="form-label text-xs text-muted"></label>
                    <input type="text" id="input-slug" name="Slug" class="form-input bg-card-border/30 dark:bg-card-border/10 text-muted cursor-not-allowed text-sm font-mono" readonly>
                </div>

                <div>
                    <label id="lbl-profile-title" class="form-label"></label>
                    <input type="text" id="input-profile-title" name="ProfileTitle" class="form-input" required>
                </div>

                <div>
                    <label id="lbl-category" class="form-label"></label>
                    <select id="select-category" name="Category" class="form-input cursor-pointer" required>
                        <option value="" disabled selected>Selecciona una categoría</option>
                    </select>
                </div>

                <!-- Contacto & Ubicación -->
                <div>
                    <label id="lbl-whatsapp" class="form-label"></label>
                    <input type="tel" id="input-whatsapp" name="WhatsAppNumber" class="form-input" required>
                </div>

                <div class="md:col-span-2">
                    <label id="lbl-zone" class="form-label"></label>
                    <input type="text" id="input-zone" name="Zone" class="form-input" required>
                </div>

                <div class="md:col-span-2">
                    <label id="lbl-map-url" class="form-label"></label>
                    <input type="url" id="input-map-url" name="MapUrl" class="form-input">
                </div>

                <!-- Descripción -->
                <div class="md:col-span-2">
                    <label id="lbl-description" class="form-label"></label>
                    <textarea id="input-description" name="Description" class="form-input" rows="4" required></textarea>
                </div>

                <!-- Gestor de Imágenes Visibles -->
                <div class="md:col-span-2 mt-2 grid grid-cols-1 md:grid-cols-2 gap-7">
                    
                    <!-- LOGO (1 Foto) -->
                    <div>
                        <label id="lbl-logo" class="form-label"></label>
                        <div class="relative border-2 border-dashed border-card-border rounded-xl p-6 hover:bg-input-bg transition-colors text-center cursor-pointer group h-40 flex flex-col justify-center">
                            <input type="file" id="logoFile" accept="image/jpeg, image/png, image/webp" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" required>
                            <div class="text-accent group-hover:text-accent-hover transition-colors mb-2">
                                <i class="fas fa-image text-3xl"></i>
                            </div>
                            <p class="text-sm font-medium">Subir Logo</p>
                            <p id="lbl-logo-help" class="text-xs text-muted mt-1"></p>
                        </div>
                        <div id="logoPreviewContainer" class="mt-4 flex justify-center"></div>
                    </div>

                    <!-- GALERÍA (3 Fotos) -->
                    <div>
                        <label id="lbl-images" class="form-label"></label>
                        <div class="relative border-2 border-dashed border-card-border rounded-xl p-6 hover:bg-input-bg transition-colors text-center cursor-pointer group h-40 flex flex-col justify-center">
                            <input type="file" id="imageFiles" accept="image/jpeg, image/png, image/webp" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" required>
                            
                            <div class="text-accent group-hover:text-accent-hover transition-colors mb-2">
                                <i class="fas fa-images text-3xl"></i>
                            </div>
                            <p id="lbl-images-drag" class="text-sm font-medium"></p>
                            <p id="lbl-images-help" class="text-xs text-muted mt-1"></p>
                        </div>
                        <div id="previewContainer" class="flex gap-3 mt-4 flex-wrap justify-center"></div>
                    </div>
                    
                    <p id="errorMsg" class="md:col-span-2 text-sm text-red-500 mt-1 font-medium hidden bg-red-50 dark:bg-red-900/20 p-3 rounded-lg"></p>
                </div>

            </div>

            <!-- Botón Submit -->
            <div class="mt-10 flex justify-end pt-6 border-t border-card-border">
                <button type="submit" id="submitBtn" class="bg-accent hover:bg-accent-hover text-white font-bold py-4 px-10 rounded-xl shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 w-full md:w-auto flex items-center justify-center gap-3 text-lg">
                    <i class="fas fa-paper-plane"></i> <span id="lbl-submit-btn"></span>
                </button>
            </div>
            
        </form>
    </div>

    <!-- MODAL DE ÉXITO -->
    <div id="successModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 transition-opacity opacity-0 duration-300">
        <div class="bg-card p-10 rounded-2xl text-center max-w-md w-full shadow-2xl transform scale-95 transition-transform duration-300 border border-card-border" id="modalContent">
            
            <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-green-100 dark:bg-green-900/30 mb-6">
                <i class="fas fa-check text-4xl text-green-600 dark:text-green-400"></i>
            </div>
            
            <h2 id="modal-title" class="text-3xl font-serif font-bold text-main mb-3"></h2>
            <p id="modal-text" class="text-muted mb-10 leading-relaxed"></p>
            
            <div class="flex flex-col gap-3">
                <button onclick="window.location.href='directorio.html'" class="w-full bg-accent hover:bg-accent-hover text-white font-bold py-3.5 px-4 rounded-xl transition-colors shadow-md flex items-center justify-center gap-2">
                    <i class="fas fa-list"></i> <span id="lbl-btn-directory"></span>
                </button>
                <button onclick="resetAndCloseModal()" class="w-full bg-input-bg hover:bg-card-border text-main font-bold py-3.5 px-4 rounded-xl transition-colors border border-card-border flex items-center justify-center gap-2">
                    <i class="fas fa-plus"></i> <span id="lbl-btn-register-another"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Lógica de la Aplicación -->
    <script>
        // DOM Elements
        const form = document.getElementById('onboardingForm');
        const fileInput = document.getElementById('imageFiles');
        const logoInput = document.getElementById('logoFile');
        const previewContainer = document.getElementById('previewContainer');
        const logoPreviewContainer = document.getElementById('logoPreviewContainer');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');
        const hiddenIframe = document.getElementById('hiddenConfirm');
        const profileNameInput = document.getElementById('input-profile-name');
        const slugInput = document.getElementById('input-slug');

        // ==========================================
        // 1. INICIALIZACIÓN E INYECCIÓN DE APP_CONFIG
        // ==========================================
        function applyDOMConfig() {
            // Acción del formulario
            form.action = APP_CONFIG.data.sheetMonkeyUrl;

            // Textos Globales
            document.getElementById('ui-page-title').textContent = APP_CONFIG.branding.pageTitle;
            document.getElementById('ui-page-subtitle').textContent = APP_CONFIG.branding.pageSubtitle;
            document.getElementById('modal-title').textContent = APP_CONFIG.branding.successModalTitle;
            document.getElementById('modal-text').textContent = APP_CONFIG.branding.successModalText;
            document.getElementById('lbl-submit-btn').textContent = APP_CONFIG.branding.btnSubmit;
            document.getElementById('lbl-btn-directory').textContent = APP_CONFIG.branding.btnDirectory;
            document.getElementById('lbl-btn-register-another').textContent = APP_CONFIG.branding.btnRegisterAnother;

            // Etiquetas de Formulario
            document.querySelector('#lbl-unique-id span').textContent = APP_CONFIG.formLabels.uniqueId;
            document.getElementById('lbl-profile-name').textContent = APP_CONFIG.formLabels.profileName;
            document.getElementById('lbl-slug').textContent = APP_CONFIG.formLabels.slug;
            document.getElementById('lbl-category').textContent = APP_CONFIG.formLabels.category;
            document.getElementById('lbl-zone').textContent = APP_CONFIG.formLabels.zone;
            document.getElementById('lbl-profile-title').textContent = APP_CONFIG.formLabels.profileTitle;
            document.getElementById('lbl-description').textContent = APP_CONFIG.formLabels.description;
            document.getElementById('lbl-whatsapp').textContent = APP_CONFIG.formLabels.whatsapp;
            document.getElementById('lbl-map-url').textContent = APP_CONFIG.formLabels.mapUrl;
            document.getElementById('lbl-logo').textContent = APP_CONFIG.formLabels.logo;
            document.getElementById('lbl-logo-help').textContent = APP_CONFIG.formLabels.logoHelp;
            document.getElementById('lbl-images').textContent = APP_CONFIG.formLabels.images;
            document.getElementById('lbl-images-drag').textContent = APP_CONFIG.formLabels.imagesDrag;
            document.getElementById('lbl-images-help').textContent = APP_CONFIG.formLabels.imagesHelp;

            // Placeholders
            document.getElementById('input-unique-id').placeholder = APP_CONFIG.formPlaceholders.uniqueId;
            document.getElementById('input-profile-name').placeholder = APP_CONFIG.formPlaceholders.profileName;
            document.getElementById('input-zone').placeholder = APP_CONFIG.formPlaceholders.zone;
            document.getElementById('input-profile-title').placeholder = APP_CONFIG.formPlaceholders.profileTitle;
            document.getElementById('input-description').placeholder = APP_CONFIG.formPlaceholders.description;
            document.getElementById('input-whatsapp').placeholder = APP_CONFIG.formPlaceholders.whatsapp;
            document.getElementById('input-map-url').placeholder = APP_CONFIG.formPlaceholders.mapUrl;

            // Dropdowns (Categorías y Zonas)
            // Se actualizó la lógica para usar Option(textoAMostrar, valorAEnviar)
            const selectCategory = document.getElementById('select-category');
            APP_CONFIG.dropdowns.categories.forEach(cat => {
                selectCategory.appendChild(new Option(cat.label, cat.id));
            });
        }

        // ==========================================
        // 1.5 AUTO-GENERADOR DE SLUG
        // ==========================================
        profileNameInput.addEventListener('input', (e) => {
            slugInput.value = e.target.value.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // Remueve acentos
                .replace(/[^a-z0-9]+/g, '-') // Reemplaza espacios/símbolos por guiones
                .replace(/(^-|-$)+/g, ''); // Elimina guiones al inicio o final
        });

        // ==========================================
        // 2. MODO OSCURO (DARK MODE)
        // ==========================================
        function initTheme() {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        }
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // ==========================================
        // 3. SEPARACIÓN DE IMÁGENES (TRUCO SHEETMONKEY)
        // ==========================================
        
        // 3.1 Procesar el LOGO (va al input oculto hf1)
        logoInput.addEventListener('change', (e) => {
            errorMsg.classList.add('hidden');
            logoPreviewContainer.innerHTML = '';
            document.getElementById('hf1').value = '';

            let file = e.target.files[0];
            if (!file) return;

            if (file.size > 2 * 1024 * 1024) {
                showError(`El logo "${file.name}" supera los 2 MB permitidos.`);
                logoInput.value = ''; return;
            }

            const dt = new DataTransfer();
            dt.items.add(file);
            document.getElementById('hf1').files = dt.files;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = document.createElement('img');
                img.src = event.target.result;
                img.className = 'w-24 h-24 object-cover rounded-xl shadow-sm border border-card-border';
                logoPreviewContainer.appendChild(img);
            };
            reader.readAsDataURL(file);
        });

        // 3.2 Procesar la GALERÍA (va a los inputs ocultos hf2, hf3, hf4)
        fileInput.addEventListener('change', (e) => {
            errorMsg.classList.add('hidden');
            previewContainer.innerHTML = '';
            
            // Limpiar inputs ocultos de la galería (hf2, hf3, hf4)
            [2, 3, 4].forEach(i => document.getElementById('hf' + i).value = '');

            let selectedFiles = Array.from(e.target.files);

            // Validar Cantidad (Max 3)
            if (selectedFiles.length > 3) {
                showError('Has superado el límite. Solo puedes subir hasta 3 imágenes en la galería.');
                fileInput.value = ''; return;
            }

            // Validar Tamaño (2MB por imagen)
            for (let file of selectedFiles) {
                if (file.size > 2 * 1024 * 1024) {
                    showError(`La imagen "${file.name}" supera los 2 MB permitidos.`);
                    fileInput.value = ''; return;
                }
            }

            // Distribuir archivos a los inputs ocultos (hf2, hf3, hf4)
            selectedFiles.forEach((file, index) => {
                const dt = new DataTransfer();
                dt.items.add(file);
                // El index 0 va a hf2, index 1 va a hf3, index 2 va a hf4
                document.getElementById('hf' + (index + 2)).files = dt.files; 

                // Generar vista previa
                const reader = new FileReader();
                reader.onload = (event) => {
                    const imgContainer = document.createElement('div');
                    imgContainer.className = 'relative w-16 h-16 sm:w-20 sm:h-20 rounded-xl overflow-hidden shadow-sm border border-card-border';
                    
                    const img = document.createElement('img');
                    img.src = event.target.result;
                    img.className = 'w-full h-full object-cover';

                    imgContainer.appendChild(img);
                    previewContainer.appendChild(imgContainer);
                };
                reader.readAsDataURL(file);
            });
        });

        function showError(msg) { 
            errorMsg.innerHTML = `<i class="fas fa-exclamation-triangle mr-2"></i> ${msg}`; 
            errorMsg.classList.remove('hidden'); 
        }

        // ==========================================
        // 4. CONTROL DE ENVÍO Y MODAL
        // ==========================================
        let isSubmitting = false;
        let originalBtnHtml = "";

        form.addEventListener('submit', (e) => {
            isSubmitting = true;
            originalBtnHtml = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
            submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Subiendo Imágenes y Datos...';
        });

        hiddenIframe.addEventListener('load', () => {
            // El load del iframe significa que SheetMonkey procesó el webhook
            if (isSubmitting) {
                isSubmitting = false;
                showSuccessModal();
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                submitBtn.innerHTML = originalBtnHtml;
            }
        });

        const modal = document.getElementById('successModal');
        const modalContent = document.getElementById('modalContent');

        function showSuccessModal() {
            modal.classList.remove('hidden');
            setTimeout(() => { 
                modal.classList.remove('opacity-0'); 
                modalContent.classList.remove('scale-95'); 
            }, 10);
        }

        function resetAndCloseModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                form.reset();
                previewContainer.innerHTML = '';
                logoPreviewContainer.innerHTML = '';
                [1, 2, 3, 4].forEach(i => document.getElementById('hf' + i).value = '');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 300);
        }

        // ==========================================
        // ARRANQUE
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => { 
            applyDOMConfig(); 
            initTheme(); 
        });
    </script>
</body>
</html>
